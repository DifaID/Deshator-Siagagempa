<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>WORLD DISASTER RADAR</title>

<link
rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

*{
box-sizing:border-box;
}

html,body{
margin:0;
width:100%;
height:100%;
background:#020509;
font-family:Arial,sans-serif;
color:white;
overflow:hidden;
}

/* =========================
HEADER
========================= */

#header{
position:fixed;
top:0;
left:0;
width:100%;
height:72px;
z-index:1000;

background:
linear-gradient(
90deg,
#020509,
#07131b,
#020509
);

border-bottom:
1px solid #12303b;

padding:10px;

text-align:center;
}

#title{
font-size:22px;
font-weight:bold;
letter-spacing:2px;
color:#00eaff;
text-shadow:
0 0 10px #00bcd4;
}

#subtitle{
font-size:10px;
color:#6f8790;
margin-top:4px;
letter-spacing:3px;
}

/* =========================
MAP
========================= */

#map{
position:absolute;
top:72px;
left:0;
width:100%;
height:calc(100% - 150px);
background:#020509;
}

/* =========================
BOTTOM PANEL
========================= */

#panel{
position:fixed;
bottom:0;
left:0;
width:100%;
height:78px;
z-index:1000;

background:
rgba(3,10,15,.97);

border-top:
1px solid #12303b;

display:grid;

grid-template-columns:
repeat(4,1fr);

padding:8px;
gap:5px;
}

.box{
text-align:center;
border-right:
1px solid #132b35;
}

.box:last-child{
border-right:none;
}

.label{
font-size:9px;
color:#64727a;
}

.value{
margin-top:6px;
font-size:15px;
font-weight:bold;
color:#00eaff;
}

/* =========================
STATUS
========================= */

#status{
position:fixed;
top:82px;
left:10px;
z-index:1000;

background:
rgba(0,0,0,.8);

border:
1px solid #173842;

border-radius:8px;

padding:8px 10px;

font-size:11px;

color:#00ff88;
}

/* =========================
LEGEND
========================= */

#legend{
position:fixed;

right:10px;

top:82px;

z-index:1000;

background:
rgba(0,0,0,.82);

border:
1px solid #173842;

border-radius:10px;

padding:10px;

font-size:10px;

line-height:2;
}

.dot{
display:inline-block;

width:9px;
height:9px;

border-radius:50%;

margin-right:5px;
}

.eq-dot{
background:red;
box-shadow:
0 0 8px red;
}

.vol-normal{
background:#00ff88;
}

.vol-yellow{
background:#ffd000;
}

.vol-orange{
background:orange;
}

.vol-red{
background:red;
}

/* =========================
EARTHQUAKE MARKER
========================= */

.eq-marker{

width:14px;
height:14px;

background:#ff2020;

border-radius:50%;

border:
2px solid white;

box-shadow:
0 0 14px red;

}

/* =========================
VOLCANO MARKER
========================= */

.volcano-marker{

width:18px;
height:18px;

border-radius:50% 50% 40% 40%;

background:#00ff88;

border:
2px solid white;

display:flex;

align-items:center;

justify-content:center;

font-size:9px;

box-shadow:
0 0 10px currentColor;

}

/* =========================
WAVE
========================= */

.wave-circle{

border:
2px solid
rgba(255,40,40,.75);

background:
rgba(255,0,0,.02);

}

/* =========================
POPUP
========================= */

.leaflet-popup-content-wrapper{

background:#081116;
color:white;

border:
1px solid #17404c;

}

.leaflet-popup-tip{

background:#081116;

}

.popup-title{

font-weight:bold;

color:#00eaff;

margin-bottom:8px;

}

.popup-data{

font-size:12px;

line-height:1.8;

}

/* =========================
LEAFLET DARK
========================= */

.leaflet-control-zoom a{

background:#081116;

color:#00eaff;

border-color:#163843;

}

</style>

</head>

<body>

<div id="header">

<div id="title">
🌍 WORLD DISASTER RADAR
</div>

<div id="subtitle">
LIVE EARTHQUAKE • VOLCANO MONITOR
</div>

</div>


<div id="status">
🟡 MEMUAT DATA...
</div>


<div id="legend">

<div>
<span class="dot eq-dot"></span>
GEMPA
</div>

<div>
<span class="dot vol-normal"></span>
GUNUNG NORMAL
</div>

<div>
<span class="dot vol-yellow"></span>
AKTIVITAS NAIK
</div>

<div>
<span class="dot vol-orange"></span>
TINGGI
</div>

<div>
<span class="dot vol-red"></span>
WARNING
</div>

</div>


<div id="map"></div>


<div id="panel">

<div class="box">

<div class="label">
GEMPA AKTIF
</div>

<div
class="value"
id="eqCount">
0
</div>

</div>


<div class="box">

<div class="label">
GUNUNG
</div>

<div
class="value"
id="volCount">
0
</div>

</div>


<div class="box">

<div class="label">
FPS
</div>

<div
class="value"
id="fps">
0
</div>

</div>


<div class="box">

<div class="label">
UPDATE
</div>

<div
class="value"
id="update">
-
</div>

</div>

</div>


<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>

/* =========================
CONFIG
========================= */

const USGS_EQ_URL =
"https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_hour.geojson";

const USGS_VOLCANO_STATUS =
"https://volcanoes.usgs.gov/vsc/api/volcanoApi/geojson";

const UPDATE_TIME =
60000;


/* =========================
MAP
========================= */

const map =
L.map("map",{
zoomControl:true,
worldCopyJump:true
})
.setView([15,0],2);


L.tileLayer(

"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

{
maxZoom:18,
attribution:"© OpenStreetMap"
}

)
.addTo(map);


/* =========================
LAYERS
========================= */

const earthquakeLayer =
L.layerGroup().addTo(map);

const waveLayer =
L.layerGroup().addTo(map);

const volcanoLayer =
L.layerGroup().addTo(map);


/* =========================
DATA
========================= */

let earthquakes = [];

let volcanoes = [];

let earthquakeMarkers = [];

let waves = [];


/* =========================
STATUS
========================= */

function setStatus(text,color="#00ff88"){

const status =
document.getElementById("status");

status.innerText = text;

status.style.color = color;

}


/* =========================
EARTHQUAKE
========================= */

async function loadEarthquakes(){

try{

setStatus(
"🟡 MENGAMBIL DATA GEMPA...",
"#ffd000"
);


const response =
await fetch(USGS_EQ_URL);


if(!response.ok){

throw new Error(
"USGS HTTP " +
response.status
);

}


const data =
await response.json();


earthquakes =
data.features;


/* CLEAR */

earthquakeLayer.clearLayers();

waveLayer.clearLayers();

waves = [];


/* LOOP */

earthquakes.forEach(eq => {

const p =
eq.properties;

const g =
eq.geometry.coordinates;


const lng = g[0];

const lat = g[1];

const depth = g[2];

const mag = p.mag;


/* MARKER */

const marker =
L.marker(

[lat,lng],

{
icon:
L.divIcon({

className:"",

html:
'<div class="eq-marker"></div>',

iconSize:[14,14],

iconAnchor:[7,7]

})

}

);


/* POPUP */

marker.bindPopup(

'<div class="popup-title">' +
'🔴 GEMPA BUMI' +
'</div>' +

'<div class="popup-data">' +

'📍 ' +
(p.place || "Tidak diketahui") +

'<br>' +

'📊 Magnitudo: M ' +
mag +

'<br>' +

'⬇ Kedalaman: ' +
depth +
' km' +

'<br>' +

'⏰ ' +
new Date(p.time)
.toLocaleString("id-ID") +

'</div>'

);


marker.addTo(
earthquakeLayer
);


/* WAVE OBJECT */

waves.push({

lat:lat,

lng:lng,

mag:mag || 0,

radius:0,

maxRadius:
Math.max(
80000,
Math.min(
mag * 180000,
1200000
)
),

circle:
L.circle(
[lat,lng],
{
radius:0,

color:"#ff2020",

weight:2,

opacity:.65,

fillOpacity:.02

}
).addTo(
waveLayer
)

});


});


document
.getElementById("eqCount")
.innerText =
earthquakes.length;


setStatus(
"🟢 DATA GEMPA LIVE"
);


updateTime();


}

catch(error){

console.error(error);

setStatus(
"🔴 GAGAL DATA GEMPA",
"#ff4444"
);

}

}


/* =========================
VOLCANO STATUS
========================= */

async function loadVolcanoes(){

try{

const response =
await fetch(
USGS_VOLCANO_STATUS
);


if(!response.ok){

throw new Error(
"VOLCANO HTTP " +
response.status
);

}


const data =
await response.json();


volcanoes =
data.features || [];


/* CLEAR */

volcanoLayer.clearLayers();


volcanoes.forEach(v => {

const props =
v.properties || {};

const coords =
v.geometry
?
v.geometry.coordinates
:
null;


if(!coords){

return;

}


const lng =
coords[0];

const lat =
coords[1];


/* STATUS */

const status =
String(

props.colorCode ||

props.color ||

props.status ||

"GREEN"

).toUpperCase();


let color =
"#00ff88";


if(
status.includes("YELLOW")
){

color="#ffd000";

}


if(
status.includes("ORANGE")
){

color="orange";

}


if(
status.includes("RED")
){

color="red";

}


/* ICON */

const icon =
L.divIcon({

className:"",

html:

'<div ' +

'style="' +

'width:18px;' +

'height:18px;' +

'background:' +
color +
';' +

'border:2px solid white;' +

'border-radius:50% 50% 35% 35%;' +

'display:flex;' +

'align-items:center;' +

'justify-content:center;' +

'font-size:10px;' +

'box-shadow:0 0 12px ' +
color +
';' +

'">' +

'🌋' +

'</div>',

iconSize:[18,18],

iconAnchor:[9,9]

});


const marker =
L.marker(
[lat,lng],
{icon:icon}
);


const name =

props.volcanoName ||

props.name ||

props.volName ||

"Volcano";


marker.bindPopup(

'<div class="popup-title">' +

'🌋 ' +
name +

'</div>' +

'<div class="popup-data">' +

'STATUS: ' +
status +

'</div>'

);


marker.addTo(
volcanoLayer
);


});


document
.getElementById("volCount")
.innerText =
volcanoes.length;


}

catch(error){

console.error(
"VOLCANO ERROR:",
error
);

/*
Tidak menghentikan
sistem gempa
jika data gunung gagal
*/

}

}


/* =========================
ANIMASI WAVE
========================= */

function animateWaves(){

waves.forEach(wave => {

wave.radius +=
Math.max(
5000,
wave.mag * 1500
);


if(
wave.radius >
wave.maxRadius
){

wave.radius = 0;

}


/* UPDATE */

wave.circle.setRadius(
wave.radius
);


});

requestAnimationFrame(
animateWaves
);

}

animateWaves();


/* =========================
FPS
========================= */

let frameCount = 0;

let lastFpsTime =
performance.now();


function calculateFPS(){

frameCount++;

const now =
performance.now();


if(
now -
lastFpsTime
>=
1000
){

document
.getElementById("fps")
.innerText =
frameCount;


frameCount = 0;

lastFpsTime = now;

}


requestAnimationFrame(
calculateFPS
);

}

calculateFPS();


/* =========================
TIME
========================= */

function updateTime(){

const now =
new Date();


document
.getElementById("update")
.innerText =

now
.toLocaleTimeString(
"id-ID"
);

}


/* =========================
LOAD ALL
========================= */

async function loadAll(){

await loadEarthquakes();

await loadVolcanoes();

}


loadAll();


setInterval(

loadAll,

UPDATE_TIME

);


</script>

</body>
</html>

<head>

<meta charset="UTF-8">

content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<link

/>

<style>

/* ================================
   RESET
================================ */

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;

    background:#03090d;

    color:white;

    font-family:
    Arial,
    sans-serif;
}


/* ================================
   HEADER
================================ */

#header{

    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:54px;

    z-index:5000;

    display:flex;

    align-items:center;

    justify-content:
    space-between;

    padding:
    0 14px;

    background:
    rgba(3,12,17,.97);

    border-bottom:
    1px solid #183b47;

}


.logo{

    font-size:12px;

    font-weight:bold;

    color:#61dcff;

}


.live{

    font-size:9px;

    font-weight:bold;

    color:#4dff8a;

    animation:
    blink 1.3s infinite;

}


@keyframes blink{

    50%{
        opacity:.3;
    }

}


/* ================================
   MAP
================================ */

#map{

    position:fixed;

    top:54px;

    left:0;

    width:100%;

    bottom:145px;

    background:#071015;

}


/* ================================
   PANEL
================================ */

.panel{

    position:fixed;

    z-index:4000;

    background:
    rgba(4,16,23,.92);

    border:
    1px solid #1b4653;

    border-radius:10px;

    padding:8px;

    backdrop-filter:
    blur(5px);

    box-shadow:
    0 3px 15px
    rgba(0,0,0,.3);

}


.panelTitle{

    color:#5edfff;

    font-size:8px;

    font-weight:bold;

    margin-bottom:5px;

}


/* ================================
   SYSTEM
================================ */

#systemPanel{

    top:63px;

    left:7px;

    font-size:8px;

}


/* ================================
   LOCATION
================================ */

#locationPanel{

    top:96px;

    left:7px;

    width:155px;

    font-size:8px;

    line-height:1.7;

}


/* ================================
   LEGEND
================================ */

#legend{

    top:63px;

    right:7px;

    font-size:8px;

    line-height:1.9;

}


.legendRow{

    display:flex;

    align-items:center;

    gap:5px;

}


.dot{

    width:9px;

    height:9px;

    border-radius:50%;

}


.redDot{
    background:#ff3030;
}

.orangeDot{
    background:#ff8a24;
}

.yellowDot{
    background:#ffe03b;
}

.greenDot{
    background:#41d67a;
}

.userDot{
    background:#258cff;
}


/* ================================
   STATS
================================ */

#statsPanel{

    position:fixed;

    bottom:145px;

    left:7px;

    z-index:4000;

    display:flex;

    gap:6px;

    font-size:8px;

}


.miniStat{

    background:
    rgba(4,16,23,.9);

    border:
    1px solid #174450;

    border-radius:8px;

    padding:6px;

    min-width:58px;

    text-align:center;

}


.miniLabel{

    color:#778990;

    font-size:7px;

}


.miniValue{

    margin-top:3px;

    color:#5bdfff;

    font-weight:bold;

    font-size:10px;

}


/* ================================
   BOTTOM
================================ */

#bottom{

    position:fixed;

    bottom:0;

    left:0;

    width:100%;

    height:145px;

    z-index:5000;

    background:
    rgba(3,12,17,.98);

    border-top:
    1px solid #183b47;

}


#feed{

    width:100%;

    height:100%;

    padding:8px;

    overflow-x:auto;

    overflow-y:hidden;

    white-space:nowrap;

    scrollbar-width:none;

}


#feed::-webkit-scrollbar{
    display:none;
}


.feedCard{

    display:inline-block;

    vertical-align:top;

    width:210px;

    height:118px;

    margin-right:7px;

    padding:9px;

    white-space:normal;

    border-radius:10px;

    background:#081820;

    border:
    1px solid #184652;

}


.feedType{

    font-size:7px;

    color:#7d9198;

}


.feedStatus{

    margin-top:4px;

    font-size:8px;

    font-weight:bold;

}


.feedMag{

    margin-top:5px;

    font-size:17px;

    font-weight:bold;

}


.feedLocation{

    margin-top:5px;

    font-size:8px;

    color:#c2d1d5;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

}


.feedDistance{

    margin-top:5px;

    font-size:8px;

    color:#63dfff;

}


/* ================================
   STATUS COLORS
================================ */

.statusActive{
    color:#ff4444;
}

.statusWarning{
    color:#ff9c31;
}

.statusIdle{
    color:#ffe34d;
}

.statusOld{
    color:#51d97f;
}


/* ================================
   USER MARKER
================================ */

.userMarker{

    width:20px;

    height:20px;

    border-radius:50%;

    background:#198dff;

    border:
    3px solid white;

    box-shadow:

    0 0 10px #198dff,

    0 0 20px #198dff;

}


/* ================================
   EARTHQUAKE MARKERS
================================ */

.eqMarker{

    width:17px;

    height:17px;

    border-radius:50%;

    border:
    2px solid white;

}


.eqRed{

    background:#ff2222;

    box-shadow:

    0 0 8px #ff2222,

    0 0 22px #ff2222;

}


.eqOrange{

    background:#ff8a22;

    box-shadow:

    0 0 7px #ff8a22,

    0 0 15px #ff8a22;

}


.eqYellow{

    background:#ffe23b;

    box-shadow:

    0 0 6px #ffe23b;

}


.eqGreen{

    background:#3ed67a;

    box-shadow:

    0 0 5px #3ed67a;

}


/* ================================
   CANVAS WAVE
================================ */

#waveCanvas{

    position:fixed;

    top:54px;

    left:0;

    width:100%;

    height:
    calc(100% - 199px);

    z-index:1000;

    pointer-events:none;

}


/* ================================
   MOBILE
================================ */

@media(max-width:420px){

    #legend{
        font-size:7px;
    }

    .miniStat{
        min-width:50px;
    }

}

</style>

</head>


<body>


<!-- HEADER -->

<div id="header">

    <div class="logo">

        🇮🇩 INDONESIA LIVE RADAR V9

    </div>

    <div class="live">

    </div>

</div>



<!-- SYSTEM -->

<div
id="systemPanel"
class="panel">

    <span id="systemText">

    </span>

</div>



<!-- LOCATION -->

<div
id="locationPanel"
class="panel">

    <div class="panelTitle">

        📍 LOKASI KAMU

    </div>

    <div id="locationText">

        Mencari GPS...

    </div>

</div>



<!-- LEGEND -->

<div
id="legend"
class="panel">

    <div class="legendRow">

        <span class="dot redDot"></span>

        Aktif

    </div>

    <div class="legendRow">

        <span class="dot orangeDot"></span>

        Mereda

    </div>

    <div class="legendRow">

        <span class="dot yellowDot"></span>

        Selesai

    </div>

    <div class="legendRow">

        <span class="dot greenDot"></span>

        Riwayat

    </div>

    <div class="legendRow">

        <span class="dot userDot"></span>

        Kamu

    </div>

</div>



<!-- MAP -->

<div id="map"></div>



<!-- WAVE -->

<canvas id="waveCanvas"></canvas>



<!-- STATS -->

<div id="statsPanel">

    <div class="miniStat">

        <div class="miniLabel">

            GEMPA

        </div>

        <div
        id="eqCount"
        class="miniValue">

            -

        </div>

    </div>


    <div class="miniStat">

        <div class="miniLabel">

            TERBESAR

        </div>

        <div
        id="largest"
        class="miniValue">

            -

        </div>

    </div>


    <div class="miniStat">

        <div class="miniLabel">

            TERDEKAT

        </div>

        <div
        id="nearest"
        class="miniValue">

            -

        </div>

    </div>


    <div class="miniStat">

        <div class="miniLabel">

            AKTIF

        </div>

        <div
        id="activeCount"
        class="miniValue">

            0

        </div>

    </div>

</div>



<!-- BOTTOM -->

<div id="bottom">

    <div id="feed"></div>

</div>



<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>


/* =====================================
   INDONESIA LIVE RADAR V9
===================================== */


/* =====================================
   BMKG URL
===================================== */

const BMKG_AUTO =
"https://data.bmkg.go.id/DataMKG/TEWS/autogempa.json";

const BMKG_TERKINI =
"https://data.bmkg.go.id/DataMKG/TEWS/gempaterkini.json";

const BMKG_DIRASAKAN =
"https://data.bmkg.go.id/DataMKG/TEWS/gempadirasakan.json";


/* =====================================
   REFRESH

   60 DETIK
===================================== */

const REFRESH_TIME =
60000;


/* =====================================
   STATUS TIME

   AKTIF
   0 - 10 menit

   MEREDA
   10 - 30 menit

   SELESAI
   30 - 60 menit

   RIWAYAT
   > 60 menit
===================================== */

const ACTIVE_TIME =
10 * 60 * 1000;

const WARNING_TIME =
30 * 60 * 1000;

const IDLE_TIME =
60 * 60 * 1000;


/* =====================================
   MAP
===================================== */

const map =
L.map(

"map",

{

preferCanvas:true,

zoomAnimation:false,

fadeAnimation:false,

markerZoomAnimation:false,

inertia:true,

minZoom:4,

maxZoom:11

}

);


/* INDONESIA */

map.setView(

[-2.5,118],

5

);


/* LIMIT */

map.setMaxBounds(

[

[-15,92],

[12,145]

]

);


/* =====================================
   OPENSTREETMAP

   TANPA API KEY
===================================== */

L.tileLayer(

"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

{

maxZoom:19,

keepBuffer:1,

updateWhenIdle:true,

attribution:
"© OpenStreetMap"

}

)

.addTo(map);


/* =====================================
   LAYERS
===================================== */

const earthquakeLayer =
L.layerGroup()
.addTo(map);


const userLayer =
L.layerGroup()
.addTo(map);


/* =====================================
   USER LOCATION
===================================== */

let userLat = null;

let userLng = null;

let userAccuracy = null;


/* =====================================
   DATA
===================================== */

let earthquakeStore =
new Map();


let firstLoad =
true;


/* =====================================
   AUDIO
===================================== */

let audioUnlocked =
false;

let audioContext =
null;


/* =====================================
   STATUS
===================================== */

function setStatus(

text,

color

){

const el =
document.getElementById(
"systemText"
);

el.innerText =
text;

el.style.color =
color;

}


/* =====================================
   PARSE COORDINATE
===================================== */

function parseCoordinate(

coordinates

){

if(!coordinates)
return null;


const parts =
String(coordinates)
.split(",");


if(parts.length < 2)
return null;


const lat =
parseFloat(parts[0]);

const lng =
parseFloat(parts[1]);


if(
isNaN(lat)
||
isNaN(lng)
)
return null;


return{

lat:lat,

lng:lng

};

}


/* =====================================
   PARSE DATE
===================================== */

function parseEarthquakeTime(

dateTime,

tanggal,

jam

){

/*

Prioritas DateTime ISO
dari BMKG

*/

if(dateTime){

const time =
new Date(dateTime);

if(!isNaN(time))
return time.getTime();

}


/*

Fallback

*/

if(tanggal && jam){

const parsed =
Date.parse(
tanggal + " " + jam
);

if(!isNaN(parsed))
return parsed;

}


/*

Jika gagal

*/

return Date.now();

}


/* =====================================
   DISTANCE
===================================== */

function distanceKm(

lat1,
lon1,
lat2,
lon2

){

const R =
6371;


const dLat =
(lat2-lat1)
*
Math.PI/180;


const dLon =
(lon2-lon1)
*
Math.PI/180;


const a =

Math.sin(
dLat/2
)

*

Math.sin(
dLat/2
)

+

Math.cos(
lat1*Math.PI/180
)

*

Math.cos(
lat2*Math.PI/180
)

*

Math.sin(
dLon/2
)

*

Math.sin(
dLon/2
);


const c =
2 *
Math.atan2(

Math.sqrt(a),

Math.sqrt(1-a)

);


return R*c;

}


/* =====================================
   DIRECTION
===================================== */

function direction(

lat1,
lon1,
lat2,
lon2

){

const y =

Math.sin(

(lon2-lon1)
*
Math.PI/180

)

*

Math.cos(
lat2*Math.PI/180
);


const x =

Math.cos(
lat1*Math.PI/180
)

*

Math.sin(
lat2*Math.PI/180
)

-

Math.sin(
lat1*Math.PI/180
)

*

Math.cos(
lat2*Math.PI/180
)

*

Math.cos(

(lon2-lon1)
*
Math.PI/180

);


let angle =

Math.atan2(y,x)
*
180/Math.PI;


angle =
(angle+360)%360;


const dirs =

[

"Utara",

"Timur Laut",

"Timur",

"Tenggara",

"Selatan",

"Barat Daya",

"Barat",

"Barat Laut"

];


return dirs[
Math.round(angle/45)%8
];

}


/* =====================================
   ID GEMPA
===================================== */

function earthquakeID(g){

return(

g.DateTime ||
""

)

+

"_"

+

(

g.Coordinates ||
""

)

+

"_"

+

(

g.Magnitude ||
""

);

}


/* =====================================
   GET STATUS

   BERDASARKAN WAKTU GEMPA
===================================== */

function getEarthquakeStatus(

time

){

const now =
Date.now();

const age =
now - time;


/*

GEMPA TERBARU

*/

if(age <= ACTIVE_TIME){

return{

name:"AKTIF",

className:"statusActive",

markerClass:"eqRed",

color:"#ff3030",

wave:true,

speed:1.8

};

}


/*

MEREDA

*/

if(age <= WARNING_TIME){

return{

name:"MEREDA",

className:"statusWarning",

markerClass:"eqOrange",

color:"#ff8a24",

wave:true,

speed:.8

};

}


/*

SELESAI

*/

if(age <= IDLE_TIME){

return{

name:"SELESAI",

className:"statusIdle",

markerClass:"eqYellow",

color:"#ffe03b",

wave:false,

speed:0

};

}


/*

RIWAYAT

*/

return{

name:"RIWAYAT",

className:"statusOld",

markerClass:"eqGreen",

color:"#41d67a",

wave:false,

speed:0

};

}


/* =====================================
   GPS
===================================== */

function getLocation(){

if(!navigator.geolocation){

document.getElementById(
"locationText"
).innerHTML =

"❌ GPS tidak didukung";

return;

}


navigator.geolocation
.getCurrentPosition(

position => {


userLat =
position.coords.latitude;

userLng =
position.coords.longitude;

userAccuracy =
position.coords.accuracy;


showUser();


},

error => {


document.getElementById(
"locationText"
).innerHTML =

"⚠️ Izinkan GPS";

},

{

enableHighAccuracy:true,

timeout:10000,

maximumAge:300000

}

);

}


/* =====================================
   SHOW USER
===================================== */

function showUser(){

userLayer.clearLayers();


const marker =
L.marker(

[

userLat,

userLng

],

{

icon:

L.divIcon(

{

className:"",

html:

'<div class="userMarker"></div>',

iconSize:
[20,20],

iconAnchor:
[10,10]

}

)

}

);


marker.bindPopup(

"<b>📍 LOKASI KAMU</b><br><br>" +

"Latitude: " +

userLat.toFixed(5)

+

"<br>" +

"Longitude: " +

userLng.toFixed(5)

+

"<br>" +

"Akurasi: ±" +

Math.round(userAccuracy)

+

" meter"

);


marker.addTo(
userLayer
);


L.circle(

[

userLat,

userLng

],

{

radius:

Math.min(
userAccuracy,
500
),

color:"#258cff",

weight:1,

opacity:.5,

fillOpacity:.05

}

)

.addTo(
userLayer
);


document.getElementById(
"locationText"
).innerHTML =

"🟢 GPS Aktif<br>" +

"🎯 Akurasi ±" +

Math.round(userAccuracy)

+

" meter";

}


/* =====================================
   LOAD GEMPA
===================================== */

async function loadEarthquakes(){

try{


setStatus(

"🟡 Mengambil data BMKG...",

"#ffd64c"

);


const results =
await Promise.allSettled(

[

fetch(
BMKG_AUTO,
{
cache:"no-store"
}
),

fetch(
BMKG_TERKINI,
{
cache:"no-store"
}
),

fetch(
BMKG_DIRASAKAN,
{
cache:"no-store"
}
)

]

);


let earthquakes =
[];


/* AUTO GEMPA */

if(
results[0].status ===
"fulfilled"
){

const data =
await results[0]
.value
.json();


if(
data?.Infogempa?.gempa
){

earthquakes.push({

...data.Infogempa.gempa,

type:"TERBARU"

});

}

}


/* GEMPA TERKINI */

if(
results[1].status ===
"fulfilled"
){

const data =
await results[1]
.value
.json();


const list =
data?.Infogempa?.gempa
||
[];


list.forEach(

g => {

earthquakes.push({

...g,

type:"M5+"

});

}

);

}


/* GEMPA DIRASAKAN */

if(
results[2].status ===
"fulfilled"
){

const data =
await results[2]
.value
.json();


const list =
data?.Infogempa?.gempa
||
[];


list.forEach(

g => {

earthquakes.push({

...g,

type:"DIRASAKAN"

});

}

);

}


/* =====================================
   HAPUS DUPLIKAT
===================================== */

const unique =
new Map();


earthquakes.forEach(

g => {

const id =
earthquakeID(g);


if(
!unique.has(id)
){

unique.set(
id,
g
);

}

}

);


earthquakes =
Array.from(
unique.values()
);


/* =====================================
   URUTKAN TERBARU
===================================== */

earthquakes.sort(

(a,b)=>{

const timeA =
parseEarthquakeTime(

a.DateTime,

a.Tanggal,

a.Jam

);


const timeB =
parseEarthquakeTime(

b.DateTime,

b.Tanggal,

b.Jam

);


return timeB-timeA;

}

);


/* MAX DATA */

earthquakes =
earthquakes.slice(
0,
30
);


/* =====================================
   SIMPAN DATA BARU
===================================== */

earthquakes.forEach(

g => {

const id =
earthquakeID(g);


if(
!earthquakeStore.has(id)
){

earthquakeStore.set(

id,

{

data:g,

detectedAt:
Date.now()

}

);


/* GEMPA BARU */

if(!firstLoad){

playSound();

}

}

}


/* =====================================
   RENDER
===================================== */

renderEarthquakes(
earthquakes
);


setStatus(

"🟢 BMKG LIVE • " +

earthquakes.length +

" GEMPA",

"#5cff96"

);


firstLoad =
false;


}

catch(error){


console.log(error);


setStatus(

"🔴 Gagal mengambil BMKG",

"#ff5555"

);

}

}


/* =====================================
   RENDER GEMPA
===================================== */

function renderEarthquakes(

earthquakes

){

earthquakeLayer.clearLayers();


const feed =
document.getElementById(
"feed"
);


feed.innerHTML =
"";


let largest =
0;


let nearest =
Infinity;


let activeTotal =
0;


/* LOOP */

earthquakes.forEach(

g => {


const coords =
parseCoordinate(
g.Coordinates
);


if(!coords)
return;


/* MAG */

const mag =
parseFloat(
g.Magnitude
)
||
0;


/* LARGEST */

largest =
Math.max(
largest,
mag
);


/* TIME */

const earthquakeTime =
parseEarthquakeTime(

g.DateTime,

g.Tanggal,

g.Jam

);


/* STATUS */

const status =
getEarthquakeStatus(
earthquakeTime
);


/* ACTIVE COUNT */

if(
status.name ===
"AKTIF"
){

activeTotal++;

}


/* DISTANCE */

let distance =
null;

let dir =
"";


if(
userLat !== null
&&
userLng !== null
){

distance =
distanceKm(

userLat,

userLng,

coords.lat,

coords.lng

);


dir =
direction(

userLat,

userLng,

coords.lat,

coords.lng

);


nearest =
Math.min(
nearest,
distance
);

}


/* =====================================
   MARKER
===================================== */

const marker =
L.marker(

[

coords.lat,

coords.lng

],

{

icon:

L.divIcon(

{

className:"",

html:

'<div class="eqMarker ' +

status.markerClass +

'"></div>',

iconSize:
[17,17],

iconAnchor:
[8,8]

}

)

}

);


/* POPUP */

marker.bindPopup(

"<b>📡 GEMPA BMKG</b><br><br>" +

"🔴 Status: <b style='color:" +

status.color +

"'>" +

status.name +

"</b><br><br>" +

"📍 " +

(
g.Wilayah ||
"Indonesia"
)

+

"<br><br>" +

"📊 Magnitudo: M " +

(
g.Magnitude ||
"-"
)

+

"<br>" +

"⬇ Kedalaman: " +

(
g.Kedalaman ||
"-"
)

+

"<br>" +

"🕒 " +

(
g.Tanggal ||
""
)

+

" " +

(
g.Jam ||
""
)

+

"<br>" +

"📏 Jarak: " +

(

distance !== null

?

Math.round(
distance
)

+

" km"

:

/* =====================================
   WAVE CANVAS
===================================== */

const canvas =
document.getElementById(
"waveCanvas"
);


const ctx =
canvas.getContext(
"2d"
);


/* =====================================
   RESIZE
===================================== */

function resizeCanvas(){

const rect =
canvas.getBoundingClientRect();


const ratio =
Math.min(

window.devicePixelRatio ||
1,

1.5

);


canvas.width =
rect.width *
ratio;


canvas.height =
rect.height *
ratio;


ctx.setTransform(

ratio,

0,

0,

ratio,

0,

0

);

}


resizeCanvas();


window.addEventListener(

"resize",

resizeCanvas

);


/* =====================================
   WAVE OBJECT
===================================== */

let wavePhase =
0;


/* =====================================
   DRAW WAVES
===================================== */

function drawWaves(){

const rect =
canvas.getBoundingClientRect();


ctx.clearRect(

0,

0,

rect.width,

rect.height

);


/* =====================================
   HANYA GEMPA
   AKTIF / MEREDA
===================================== */

earthquakeStore.forEach(

item => {


const g =
item.data;


const coords =
parseCoordinate(
g.Coordinates
);


if(!coords)
return;


/* WAKTU */

const time =
parseEarthquakeTime(

g.DateTime,

g.Tanggal,

g.Jam

);


/* STATUS */

const status =
getEarthquakeStatus(
time
);


/* STOP JIKA
   SELESAI / RIWAYAT */

if(
!status.wave
)
return;


/* POSISI PETA */

const point =
map.latLngToContainerPoint(

[

coords.lat,

coords.lng

]

);


/* JIKA DI LUAR MAP */

if(

point.x < -200

||

point.y < -200

||

point.x >
rect.width + 200

||

point.y >
rect.height + 200

)

return;


/* =====================================
   WAVE CONFIG
===================================== */

const mag =
parseFloat(
g.Magnitude
)
||
3;


/*

AKTIF

5 RING

MEREDA

3 RING

*/

const ringCount =

status.name === "AKTIF"

?

5

:

3;


/*

SPEED

*/

const speed =

status.speed;


/* =====================================
   DRAW RINGS
===================================== */

for(

let i=0;

i<ringCount;

i++

){


const offset =

(

wavePhase *
speed

+

i * 22

)

%

110;


const radius =
15 + offset;


/* ALPHA */

let alpha =
1 -
(
offset / 110
);


/* MEREDA */

if(
status.name ===
"MEREDA"
){

alpha *= .65;

}


/* GRADIENT */

ctx.beginPath();


ctx.arc(

point.x,

point.y,

radius,

0,

Math.PI*2

);


ctx.strokeStyle =

status.name ===
"AKTIF"

?

"rgba(255,40,40," +
alpha +
")"

:

"rgba(255,140,30," +
alpha +
")";


ctx.lineWidth =

status.name ===
"AKTIF"

?

2

:

1.5;


ctx.stroke();


}


/* =====================================
   PULSE CENTER
===================================== */

const pulse =
8 +

Math.sin(

wavePhase*.12

)

*
3;


ctx.beginPath();


ctx.arc(

point.x,

point.y,

pulse,

0,

Math.PI*2

);


ctx.fillStyle =

status.name ===
"AKTIF"

?

"rgba(255,40,40,.25)"

:

"rgba(255,140,30,.18)";


ctx.fill();


}

);


/* UPDATE */

wavePhase +=
1.3;


requestAnimationFrame(
drawWaves
);

}


drawWaves();

/* =====================================
   SOUND
===================================== */

function playSound(){

if(
!audioUnlocked
)
return;


try{


if(
!audioContext
){

audioContext =
new(

window.AudioContext
||
window.webkitAudioContext

)();

}


/* BEEP 1 */

const osc =
audioContext
.createOscillator();


const gain =
audioContext
.createGain();


osc.connect(gain);

gain.connect(
audioContext.destination
);


osc.type =
"sine";


osc.frequency.setValueAtTime(

650,

audioContext.currentTime

);


osc.frequency.linearRampToValueAtTime(

900,

audioContext.currentTime + .25

);


gain.gain.setValueAtTime(

.08,

audioContext.currentTime

);


gain.gain.exponentialRampToValueAtTime(

.001,

audioContext.currentTime + .8

);


osc.start();


osc.stop(

audioContext.currentTime + .8

);


}

catch(error){

console.log(error);

}

}

!navigator.geolocation
)
return;


navigator.geolocation
.getCurrentPosition(

position => {


userLat =
position.coords.latitude;

userLng =
position.coords.longitude;

userAccuracy =
position.coords.accuracy;


showUser();


},

()=>{},

{

enableHighAccuracy:true,

timeout:8000,

maximumAge:300000

}

);

}

<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>DESHATOR LIVE SEISMOGRAPH</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#050505;
color:white;
font-family:Arial,sans-serif;
padding:15px;
}

.container{
max-width:900px;
margin:auto;
}

h1{
text-align:center;
color:cyan;
margin-bottom:5px;
}

.subtitle{
text-align:center;
color:#777;
font-size:12px;
margin-bottom:20px;
}

.card{
background:#101010;
border:1px solid #222;
border-radius:20px;
padding:18px;
margin-bottom:15px;
}

.status{
text-align:center;
padding:14px;
border-radius:12px;
background:#181818;
color:#ffd000;
font-weight:bold;
}

.live{
color:#00ff88;
}

.error{
color:#ff4444;
}

select,
input,
button{
width:100%;
padding:14px;
margin-top:10px;
border-radius:12px;
font-size:15px;
}

select,
input{
background:#181818;
color:white;
border:1px solid #333;
}

button{
border:none;
background:cyan;
color:black;
font-weight:bold;
cursor:pointer;
}

.red{
background:#ff4444;
color:white;
}

.station{
text-align:center;
font-size:22px;
color:cyan;
font-weight:bold;
margin:20px 0;
word-break:break-word;
}

.graph-box{
position:relative;
height:330px;
}

canvas{
width:100%;
height:100%;
background:#050505;
border:1px solid #222;
border-radius:12px;
}

.watermark{
position:absolute;

top:50%;
left:50%;

transform:
translate(-50%,-50%);

font-size:25px;

font-weight:bold;

color:
rgba(255,255,255,.08);

pointer-events:none;

white-space:nowrap;
}

.data{
display:grid;

grid-template-columns:
repeat(2,1fr);

gap:10px;

margin-top:15px;
}

.box{
background:#181818;
padding:12px;
border-radius:12px;
text-align:center;
}

.label{
font-size:11px;
color:#777;
}

.value{
color:cyan;
font-weight:bold;
margin-top:5px;
word-break:break-word;
}

.info{
color:#aaa;
font-size:13px;
line-height:1.6;
word-break:break-word;
}

.footer{
text-align:center;
color:#555;
font-size:11px;
margin:20px;
}

</style>

</head>

<body>

<div class="container">

<h1>🌍 DESHATOR</h1>

<div class="subtitle">

REAL-TIME SEISMIC MONITOR

</div>


<div class="card">


<div
class="status"
id="status">

🟡 SISTEM SIAP

</div>


<input

id="search"

placeholder="🔎 Cari stream, contoh IU_ANMO"

oninput="filterStreams()"

>


<select
id="streams">

<option>

Tekan MUAT STREAM

</option>

</select>


<button
onclick="loadStreams()">

📡 MUAT STREAM EARTHSCOPE

</button>


<button
onclick="connectStream()">

▶ HUBUNGKAN STREAM

</button>


<button
class="red"
onclick="disconnectStream()">

■ PUTUSKAN

</button>


<div
class="station"
id="station">

BELUM ADA STREAM

</div>


<div class="graph-box">

<canvas
id="graph">
</canvas>

<div class="watermark">

IG.RMN.TMS.TYNP3

</div>

</div>


<div class="data">


<div class="box">

<div class="label">

STATUS

</div>

<div
class="value"
id="connection">

OFFLINE

</div>

</div>


<div class="box">

<div class="label">

STREAM

</div>

<div
class="value"
id="streamName">

-

</div>

</div>


<div class="box">

<div class="label">

PAKET

</div>

<div
class="value"
id="packets">

0

</div>

</div>


<div class="box">

<div class="label">

DATA

</div>

<div
class="value"
id="data">

MENUNGGU

</div>

</div>


</div>

</div>


<div class="card">

<h3>📡 INFORMASI</h3>

<div
class="info"
id="info">

Sistem siap.

<br><br>

Tekan tombol
<b>MUAT STREAM EARTHSCOPE</b>

untuk mengambil daftar stream asli.

</div>

</div>


<div class="footer">

EARTHSCOPE • SEEDLINK

<br><br>

DESHATOR

<br>

IG.RMN.TMS.TYNP3

</div>

</div>


<script>


/* =========================

KONFIGURASI

========================= */


const HTTP_URL =

"https://rtserve.earthscope.org/streams/json";


const WS_URL =

"wss://rtserve.earthscope.org/seedlink";


let allStreams = [];

let socket = null;

let packetCount = 0;


/* =========================

ELEMENT

========================= */


const status =
document.getElementById("status");


const streams =
document.getElementById("streams");


const info =
document.getElementById("info");


/* =========================

STATUS

========================= */


function setStatus(text,type=""){


status.innerText = text;


status.className =
"status";


if(type){

status.classList.add(type);

}


}


/* =========================

LOAD STREAM

========================= */


async function loadStreams(){


setStatus(

"🟡 MENGAMBIL STREAM..."

);


info.innerHTML =

"Sedang mengambil daftar "

+

"stream dari EarthScope...";


streams.innerHTML =

"<option>Memuat...</option>";


try{


const response =

await fetch(

HTTP_URL

);


if(!response.ok){

throw new Error(

"HTTP " +

response.status

);

}


const data =

await response.json();


console.log(

"EARTHSCOPE DATA:",

data

);


/* KUMPULKAN DATA */


allStreams = [];


/*
EarthScope ringserver
biasanya mengembalikan
array stream.
*/


if(Array.isArray(data)){


allStreams = data;


}


else if(data.streams){


allStreams = data.streams;


}


else{


for(const key in data){


if(Array.isArray(data[key])){


allStreams =

data[key];

break;


}


}


}


if(allStreams.length === 0){


throw new Error(

"STREAM KOSONG"

);


}


/* TAMPILKAN */


showStreams(
allStreams
);


setStatus(

"🟢 STREAM DITEMUKAN: " +

allStreams.length,

"live"

);


info.innerHTML =

"✅ Berhasil mengambil "

+

allStreams.length

+

" data stream.<br><br>"

+

"Pilih salah satu stream, "

+

"lalu tekan HUBUNGKAN.";


}


catch(error){


console.error(error);


setStatus(

"🔴 GAGAL MEMUAT STREAM",

"error"

);


streams.innerHTML =

"<option>Gagal memuat</option>";


info.innerHTML =

"ERROR:<br><br>"

+

error.message

+

"<br><br>"

+

"URL yang dicoba:<br>"

+

HTTP_URL;


}


}


/* =========================

TAMPIL STREAM

========================= */


function showStreams(list){


streams.innerHTML = "";


/* BATASI AGAR HP TIDAK BERAT */


const limited =

list.slice(0,1000);


limited.forEach(function(item){


let id;


/* JIKA STRING */


if(typeof item === "string"){


id = item;


}


/* JIKA OBJECT */


else{


id =

item.stream ||
item.id ||
item.streamid ||
item.name ||
item.sid ||
JSON.stringify(item);


}


const option =

document.createElement(
"option"
);


option.value = id;


option.textContent = id;


streams.appendChild(
option
);


});


}


/* =========================

CARI STREAM

========================= */


function filterStreams(){


const keyword =

document
.getElementById("search")
.value
.toLowerCase();


if(!keyword){


showStreams(
allStreams
);

return;


}


const filtered =

allStreams.filter(function(item){


const text =

typeof item === "string"

?

item

:

JSON.stringify(item);


return text
.toLowerCase()
.includes(keyword);


});


showStreams(
filtered
);


}


/* =========================

CONNECT

========================= */


function connectStream(){


const selected =

streams.value;


if(

!selected ||

selected === "Memuat..." ||

selected === "Gagal memuat"

){


alert(

"Muat dan pilih stream dulu"

);

return;


}


disconnectStream();


document
.getElementById("station")
.innerText =
selected;


document
.getElementById("streamName")
.innerText =
selected;


document
.getElementById("connection")
.innerText =
"MENGHUBUNGKAN";


setStatus(

"🟡 MENGHUBUNGKAN..."

);


packetCount = 0;


document
.getElementById("packets")
.innerText =
"0";


try{


socket =

new WebSocket(
WS_URL
);


socket.binaryType =
"arraybuffer";


socket.onopen =
function(){


document
.getElementById("connection")
.innerText =
"ONLINE";


setStatus(

"🟢 TERHUBUNG EARTHSCOPE",

"live"

);


info.innerHTML =

"WebSocket berhasil terhubung."

+

"<br><br>"

+

"📡 Meminta informasi "

+

"stream dari server...";


/*
Minta info stream dulu

SeedLink command
harus dikirim
sebagai WebSocket frame
*/


socket.send(

"INFO STREAMS"

);


};


socket.onmessage =
function(event){


if(typeof event.data ===
"string"){


console.log(

"SEEDLINK:",

event.data

);


info.innerHTML =

"RESPONS SERVER:<br><br>"

+

event.data
.substring(0,1000);


return;


}


/* DATA BINARY */


if(event.data instanceof ArrayBuffer){


packetCount++;


document
.getElementById("packets")
.innerText =
packetCount;


document
.getElementById("data")
.innerText =
"DATA BINARY";


setStatus(

"🟢 DATA MASUK",

"live"

);


}


};


socket.onerror =
function(error){


console.error(error);


setStatus(

"🔴 KONEKSI ERROR",

"error"

);


document
.getElementById("connection")
.innerText =
"ERROR";


};


socket.onclose =
function(){


document
.getElementById("connection")
.innerText =
"OFFLINE";


setStatus(

"🔴 TERPUTUS",

"error"

);


};


}

catch(error){


console.error(error);


setStatus(

"🔴 GAGAL KONEKSI",

"error"

);


}


}


/* =========================

DISCONNECT

========================= */


function disconnectStream(){


if(socket){


socket.close();


socket = null;


}


document
.getElementById("connection")
.innerText =
"OFFLINE";


}


/* =========================

CANVAS

========================= */


const canvas =

document.getElementById(
"graph"
);


const ctx =

canvas.getContext(
"2d"
);


function resize(){


canvas.width =
canvas.offsetWidth;


canvas.height =
canvas.offsetHeight;


}


resize();


window.addEventListener(

"resize",

resize

);


function draw(){


ctx.clearRect(

0,
0,
canvas.width,
canvas.height

);


/* GARIS TENGAH */


ctx.beginPath();


ctx.strokeStyle =

"rgba(255,255,255,.1)";


ctx.moveTo(

0,

canvas.height/2

);


ctx.lineTo(

canvas.width,

canvas.height/2

);


ctx.stroke();


requestAnimationFrame(
draw
);


}


draw();


</script>

</body>
</html>

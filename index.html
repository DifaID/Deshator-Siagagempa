<script>

/* ==========================================
   INDONESIA LIVE RADAR V7

   RINGAN UNTUK HP

========================================== */


/* ==========================================
   BMKG URL

========================================== */

const BMKG_AUTO =
"https://data.bmkg.go.id/DataMKG/TEWS/autogempa.json";

const BMKG_TERKINI =
"https://data.bmkg.go.id/DataMKG/TEWS/gempaterkini.json";

const BMKG_DIRASAKAN =
"https://data.bmkg.go.id/DataMKG/TEWS/gempadirasakan.json";


/* ==========================================
   WEATHER BMKG

   Akan mencoba mencari titik cuaca terdekat

========================================== */

const WEATHER_POINTS =
"https://datacuaca.bmkg.go.id/arcgis/rest/services/production/prakiraan_cuaca/FeatureServer/0/query";


/* ==========================================
   MAGMA

   Best effort.
   Jika browser diblokir CORS,
   website tidak membuat data palsu.

========================================== */

const MAGMA_URL =
"https://magma.esdm.go.id/v1/gunung-api/tingkat-aktivitas";


/* ==========================================
   REFRESH

========================================== */

const GEMPA_REFRESH =
60000;

const WEATHER_REFRESH =
1800000;

const VOLCANO_REFRESH =
600000;


/* ==========================================
   MAP

========================================== */

const map = L.map(

"map",

{

    preferCanvas:true,

    fadeAnimation:false,

    zoomAnimation:false,

    markerZoomAnimation:false,

    inertia:true,

    zoomControl:true,

    minZoom:4,

    maxZoom:10

}

);


/* FOKUS INDONESIA */

map.setView(

[-2.5,118],

5

);


/* BATAS INDONESIA */

map.setMaxBounds(

[

[-15,92],

[12,145]

]

);


/* MAP TILE */

L.tileLayer(

"https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",

{

    maxZoom:18,

    updateWhenIdle:true,

    updateWhenZooming:false,

    keepBuffer:1,

    attribution:
    "© OpenStreetMap © CARTO"

}

).addTo(map);



/* ==========================================
   LAYERS

========================================== */

const earthquakeLayer =
L.layerGroup().addTo(map);

const volcanoLayer =
L.layerGroup().addTo(map);

const userLayer =
L.layerGroup().addTo(map);



/* ==========================================
   USER DATA

========================================== */

let userLat = null;

let userLng = null;

let userAccuracy = null;



/* ==========================================
   KNOWN EVENTS

========================================== */

let knownEarthquakes =
new Set();

let firstEarthquakeLoad =
true;



/* ==========================================
   STATUS

========================================== */

function setSystemStatus(

text,
color

){

    const el =
    document.getElementById(
    "systemText"
    );

    el.innerText =
    text;

    el.style.color =
    color || "#5cff9a";

}



/* ==========================================
   DISTANCE

========================================== */

function distanceKm(

lat1,
lon1,
lat2,
lon2

){

    const R = 6371;

    const dLat =
    (lat2-lat1) *
    Math.PI/180;

    const dLon =
    (lon2-lon1) *
    Math.PI/180;

    const a =

    Math.sin(dLat/2) *
    Math.sin(dLat/2)

    +

    Math.cos(
    lat1*Math.PI/180
    )

    *

    Math.cos(
    lat2*Math.PI/180
    )

    *

    Math.sin(dLon/2) *
    Math.sin(dLon/2);


    return

    R *

    2 *

    Math.atan2(

        Math.sqrt(a),

        Math.sqrt(1-a)

    );

}



/* ==========================================
   DIRECTION

========================================== */

function getDirection(

lat1,
lon1,
lat2,
lon2

){

    const y =

    Math.sin(
    (lon2-lon1) *
    Math.PI/180
    )

    *

    Math.cos(
    lat2*Math.PI/180
    );


    const x =

    Math.cos(
    lat1*Math.PI/180
    )

    *

    Math.sin(
    lat2*Math.PI/180
    )

    -

    Math.sin(
    lat1*Math.PI/180
    )

    *

    Math.cos(
    lat2*Math.PI/180
    )

    *

    Math.cos(
    (lon2-lon1) *
    Math.PI/180
    );


    let bearing =

    Math.atan2(y,x)
    *
    180/Math.PI;


    bearing =
    (bearing+360)%360;


    const dirs =

    [

        "Utara",
        "Timur Laut",
        "Timur",
        "Tenggara",
        "Selatan",
        "Barat Daya",
        "Barat",
        "Barat Laut"

    ];


    return

    dirs[
    Math.round(
    bearing/45
    )%8
    ];

}



/* ==========================================
   PARSE COORDINATE

========================================== */

function parseCoordinate(
text
){

    if(!text)
    return null;

    const p =
    String(text)
    .split(",");

    if(p.length < 2)
    return null;


    const lat =
    parseFloat(
    p[0]
    );

    const lng =
    parseFloat(
    p[1]
    );


    if(
        isNaN(lat)
        ||
        isNaN(lng)
    )
    return null;


    return {

        lat,
        lng

    };

}



/* ==========================================
   GEMPA ID

========================================== */

function earthquakeID(
g
){

    return

    (

        g.DateTime ||
        g.Tanggal ||
        ""

    )

    +

    "_"

    +

    (

        g.Coordinates ||
        ""

    )

    +

    "_"

    +

    (

        g.Magnitude ||
        ""

    );

}



/* ==========================================
   GPS

========================================== */

function getUserLocation(){

    if(
    !navigator.geolocation
    ){

        document.getElementById(
        "locationText"
        ).innerHTML =

        "❌ GPS tidak didukung";

        return;

    }


    navigator.geolocation.getCurrentPosition(

        position => {


            userLat =
            position.coords.latitude;

            userLng =
            position.coords.longitude;

            userAccuracy =
            position.coords.accuracy;


            showUserMarker();


            document.getElementById(
            "locationText"
            ).innerHTML =

            "🟢 GPS Aktif<br>" +

            "🎯 Akurasi ±" +

            Math.round(
            userAccuracy
            ) +

            " meter";


            loadWeather();


        },


        error => {

            document.getElementById(
            "locationText"
            ).innerHTML =

            "⚠️ Izinkan lokasi GPS";


        },


        {

            enableHighAccuracy:true,

            timeout:10000,

            maximumAge:120000

        }

    );

}



/* ==========================================
   USER MARKER

========================================== */

function showUserMarker(){

    userLayer.clearLayers();


    const marker =

    L.marker(

        [

            userLat,
            userLng

        ],

        {

            icon:

            L.divIcon({

                className:"",

                html:
                '<div class="userMarker"></div>',

                iconSize:
                [19,19],

                iconAnchor:
                [9,9]

            })

        }

    );


    marker.bindPopup(

        "<b>📍 LOKASI KAMU</b><br><br>" +

        "Lat: " +

        userLat.toFixed(4) +

        "<br>" +

        "Lng: " +

        userLng.toFixed(4)

    );


    marker.addTo(
    userLayer
    );


    L.circle(

        [

            userLat,
            userLng

        ],

        {

            radius:
            Math.min(
            userAccuracy,
            500
            ),

            color:"#168cff",

            weight:1,

            opacity:.5,

            fillOpacity:.05

        }

    )

    .addTo(
    userLayer
    );

}



/* ==========================================
   LOAD GEMPA

========================================== */

async function loadEarthquakes(){

    try{


        setSystemStatus(

        "🟡 Mengambil data BMKG...",

        "#ffd44f"

        );


        const results =

        await Promise.allSettled(

            [

                fetch(

                BMKG_AUTO,

                {

                    cache:"no-store"

                }

                ),

                fetch(

                BMKG_TERKINI,

                {

                    cache:"no-store"

                }

                ),

                fetch(

                BMKG_DIRASAKAN,

                {

                    cache:"no-store"

                }

                )

            ]

        );


        let all = [];


        /* GEMPA TERBARU */

        if(
        results[0].status ===
        "fulfilled"
        ){

            const data =

            await results[0]
            .value
            .json();


            if(
            data?.Infogempa?.gempa
            ){

                all.push({

                    ...data.Infogempa.gempa,

                    category:
                    "TERBARU"

                });

            }

        }


        /* GEMPA TERKINI */

        if(
        results[1].status ===
        "fulfilled"
        ){

            const data =

            await results[1]
            .value
            .json();


            const list =

            data?.Infogempa?.gempa ||
            [];


            list.forEach(

                g => {

                    all.push({

                        ...g,

                        category:
                        "M5+"

                    });

                }

            );

        }


        /* DIRASAKAN */

        if(
        results[2].status ===
        "fulfilled"
        ){

            const data =

            await results[2]
            .value
            .json();


            const list =

            data?.Infogempa?.gempa ||
            [];


            list.forEach(

                g => {

                    all.push({

                        ...g,

                        category:
                        "DIRASAKAN"

                    });

                }

            );

        }


        /* HAPUS DUPLIKAT */

        const unique =
        new Map();


        all.forEach(

            g => {

                const id =
                earthquakeID(g);


                if(
                !unique.has(id)
                ){

                    unique.set(
                    id,
                    g
                    );

                }

            }

        );


        all =

        Array.from(
        unique.values()
        )


        /* BATASI AGAR RINGAN */

        .slice(
        0,
        25
        );


        renderEarthquakes(
        all
        );


        setSystemStatus(

        "🟢 BMKG LIVE • " +

        all.length +

        " GEMPA",

        "#5cff9a"

        );


        firstEarthquakeLoad =
        false;


    }

    catch(error){


        console.log(
        error
        );


        setSystemStatus(

        "🔴 Data BMKG gagal dimuat",

        "#ff5555"

        );

    }

}



/* ==========================================
   RENDER GEMPA

========================================== */

function renderEarthquakes(

earthquakes

){


    earthquakeLayer.clearLayers();


    const feed =

    document.getElementById(
    "feed"
    );


    feed.innerHTML = "";


    let largest = 0;

    let nearest =
    Infinity;


    earthquakes.forEach(

        g => {


            const coords =

            parseCoordinate(
            g.Coordinates
            );


            if(!coords)
            return;


            const mag =

            parseFloat(
            g.Magnitude
            ) || 0;


            largest =
            Math.max(

                largest,
                mag

            );


            let distance =
            null;

            let direction =
            "";


            if(

                userLat !== null

                &&

                userLng !== null

            ){

                distance =

                distanceKm(

                    userLat,

                    userLng,

                    coords.lat,

                    coords.lng

                );


                direction =

                getDirection(

                    userLat,

                    userLng,

                    coords.lat,

                    coords.lng

                );


                nearest =
                Math.min(

                    nearest,

                    distance

                );

            }


            /* MARKER */

            const marker =

            L.marker(

                [

                    coords.lat,

                    coords.lng

                ],

                {

                    icon:

                    L.divIcon({

                        className:"",

                        html:
                        '<div class="eqMarker"></div>',

                        iconSize:
                        [14,14],

                        iconAnchor:
                        [7,7]

                    })

                }

            );


            marker.bindPopup(

                "<b>🔴 GEMPA BMKG</b><br><br>" +

                "📍 " +

                (
                g.Wilayah ||
                "Indonesia"
                )

                +

                "<br><br>" +

                "📊 Magnitudo: M " +

                (
                g.Magnitude ||
                "-"
                )

                +

                "<br>" +

                "⬇ Kedalaman: " +

                (
                g.Kedalaman ||
                "-"
                )

                +

                "<br>" +

                "🕒 " +

                (
                g.Tanggal ||
                ""
                )

                +

                " " +

                (
                g.Jam ||
                ""
                )

                +

                "<br>" +

                "📏 Jarak: " +

                (

                    distance !== null

                    ?

                    Math.round(
                    distance
                    ) +
                    " km"

                    :

                    "GPS belum aktif"

                )

                +

                "<br>" +

                "🧭 Arah: " +

                (
                direction ||
                "-"
                )

                +

                "<br>" +

                "⚠️ " +

                (
                g.Potensi ||
                "-"
                )

            );


            marker.addTo(
            earthquakeLayer
            );


            /* GEMPA BARU */

            const id =
            earthquakeID(g);


            if(

                !firstEarthquakeLoad

                &&

                !knownEarthquakes.has(
                id
                )

            ){

                createWave(

                    coords.lat,

                    coords.lng,

                    mag

                );


                playNotification();

            }


            /* FEED */

            const card =

            document.createElement(
            "div"
            );


            card.className =
            "feedCard";


            card.innerHTML =

            '<div class="feedType">' +

            '🔴 GEMPA ' +

            (
            g.category ||
            ""
            )

            +

            '</div>' +

            '<div class="feedTitle red">' +

            'M ' +

            (
            g.Magnitude ||
            "-"
            )

            +

            '</div>' +

            '<div class="feedInfo">' +

            '📍 ' +

            (
            g.Wilayah ||
            "Indonesia"
            )

            +

            '</div>' +

            '<div class="feedInfo blue">' +

            (

                distance !== null

                ?

                '📏 ' +

                Math.round(
                distance
                ) +

                ' km • ' +

                direction

                :

                '📍 GPS belum aktif'

            )

            +

            '</div>';


            feed.appendChild(
            card
            );


        }

    );


    /* UPDATE KNOWN */

    knownEarthquakes =
    new Set(

        earthquakes.map(

            g =>
            earthquakeID(g)

        )

    );


    /* STATS */

    document.getElementById(
    "eqCount"
    ).innerText =

    earthquakes.length;


    document.getElementById(
    "largest"
    ).innerText =

    largest

    ?

    "M " +
    largest

    :

    "-";


    document.getElementById(
    "nearest"
    ).innerText =

    nearest !== Infinity

    ?

    Math.round(
    nearest
    ) +
    " km"

    :

    "-";


    document.getElementById(
    "lastUpdate"
    ).innerText =

    new Date()

    .toLocaleTimeString(

        "id-ID",

        {

            hour:"2-digit",

            minute:"2-digit"

        }

    );

}



/* ==========================================
   WEATHER

   Mencoba titik BMKG terdekat.

========================================== */

async function loadWeather(){

    if(

        userLat === null

        ||

        userLng === null

    ){

        return;

    }


    try{


        document.getElementById(
        "weatherText"
        ).innerText =

        "Mencari data BMKG...";


        const geometry =

        userLng +
        "," +
        userLat;


        const url =

        WEATHER_POINTS +

        "?where=1%3D1" +

        "&geometry=" +

        encodeURIComponent(
        geometry
        )

        +

        "&geometryType=esriGeometryPoint" +

        "&inSR=4326" +

        "&spatialRel=esriSpatialRelIntersects" +

        "&distance=100" +

        "&units=esriSRUnit_Kilometer" +

        "&outFields=*" +

        "&returnGeometry=true" +

        "&resultRecordCount=1" +

        "&f=json";


        const response =

        await fetch(

            url,

            {

                cache:"no-store"

            }

        );


        const data =
        await response.json();


        const feature =

        data.features?.[0];


        if(!feature){

            document.getElementById(
            "weatherText"
            ).innerHTML =

            "🌤️ Data wilayah belum ditemukan";

            return;

        }


        const a =
        feature.attributes || {};


        const temp =

        a.t ??
        a.t_avg ??
        "-";


        const humidity =

        a.h ??
        a.hu ??
        "-";


        const wind =

        a.win_velocity ??
        a.ws ??
        "-";


        document.getElementById(
        "weatherText"
        ).innerHTML =

        "🌡️ " +

        temp +

        "°C &nbsp; 💧 " +

        humidity +

        "%<br>" +

        "💨 " +

        wind +

        " km/jam";


    }

    catch(error){


        document.getElementById(
        "weatherText"
        ).innerHTML =

        "🌤️ Data cuaca BMKG belum tersedia";


    }

}

/* ==========================================
   RENDER VOLCANO

========================================== */

function renderVolcanoData(

data

){

    volcanoLayer.clearLayers();


    let items = [];


    /* CARI ARRAY DARI BERBAGAI FORMAT */

    if(
    Array.isArray(data)
    ){

        items = data;

    }

    else if(
    data.data
    ){

        items =

        Array.isArray(
        data.data
        )

        ?

        data.data

        :

        [];

    }


    items.forEach(

        v => {


            const status =

            String(

                v.level ||
                v.status ||
                v.tingkat_aktivitas ||
                ""

            );


            /* HANYA AKTIF */

            const active =

            status.includes(
            "II"
            )

            ||

            status.includes(
            "III"
            )

            ||

            status.includes(
            "IV"
            )

            ||

            status.includes(
            "Waspada"
            )

            ||

            status.includes(
            "Siaga"
            )

            ||

            status.includes(
            "Awas"
            );


            if(!active)
            return;


            const lat =

            parseFloat(

                v.latitude ||
                v.lat

            );


            const lng =

            parseFloat(

                v.longitude ||
                v.lng

            );


            if(

                isNaN(lat)

                ||

                isNaN(lng)

            )

            return;


            const name =

            v.nama ||
            v.name ||
            "Gunung Api";


            const marker =

            L.marker(

                [

                    lat,
                    lng

                ],

                {

                    icon:

                    L.divIcon({

                        className:"",

                        html:

                        '<div class="volcanoMarker">' +

                        '🌋' +

                        '</div>',

                        iconSize:
                        [20,20],

                        iconAnchor:
                        [10,10]

                    })

                }

            );


            marker.bindPopup(

                "<b>🌋 " +

                name +

                "</b><br><br>" +

                "Status: " +

                status +

                "<br><br>" +

                "Sumber: PVMBG / MAGMA"

            );


            marker.addTo(
            volcanoLayer
            );


        }

    );

}

/* ==========================================
   WAVE SYSTEM

   Maks 30 FPS
   Lebih ringan untuk HP

========================================== */

const canvas =

document.getElementById(
"waveCanvas"
);

const ctx =

canvas.getContext(
"2d"
);


let waves = [];


function resizeCanvas(){

    const rect =

    canvas.getBoundingClientRect();


    const ratio =

    Math.min(

        window.devicePixelRatio ||
        1,

        1.5

    );


    canvas.width =
    rect.width *
    ratio;

    canvas.height =
    rect.height *
    ratio;


    ctx.setTransform(

        ratio,

        0,

        0,

        ratio,

        0,

        0

    );

}


resizeCanvas();


window.addEventListener(

"resize",

resizeCanvas

);



/* ==========================================
   CREATE WAVE

========================================== */

function createWave(

lat,
lng,
mag

){

    waves.push(

        {

            lat,

            lng,

            radius:8,

            alpha:1,

            speed:

            1.8 +

            Math.min(
            mag,
            8
            )
            *
            .15,

            max:

            70 +

            Math.min(
            mag,
            8
            )
            *
            18

        }

    );

}



/* ==========================================
   DRAW WAVE

========================================== */

let lastFrame = 0;


function animateWaves(
time
){

    /* 30 FPS */

    if(

        time -
        lastFrame

        <

        33

    ){

        requestAnimationFrame(
        animateWaves
        );

        return;

    }


    lastFrame =
    time;


    const rect =

    canvas.getBoundingClientRect();


    ctx.clearRect(

        0,

        0,

        rect.width,

        rect.height

    );


    waves.forEach(

        wave => {


            const point =

            map.latLngToContainerPoint(

                [

                    wave.lat,

                    wave.lng

                ]

            );


            ctx.beginPath();


            ctx.arc(

                point.x,

                point.y,

                wave.radius,

                0,

                Math.PI * 2

            );


            ctx.strokeStyle =

            "rgba(255,40,40," +

            wave.alpha +

            ")";


            ctx.lineWidth =
            2;


            ctx.stroke();


            wave.radius +=
            wave.speed;


            wave.alpha -=
            .018;


        }

    );


    waves =

    waves.filter(

        wave =>

        wave.alpha > 0

        &&

        wave.radius < wave.max

    );


    requestAnimationFrame(
    animateWaves
    );

}


requestAnimationFrame(
animateWaves
);



/* ==========================================
   SOUND

========================================== */

let audioContext =
null;


function playNotification(){

    try{


        if(
        !audioContext
        ){

            audioContext =

            new (

                window.AudioContext ||

                window.webkitAudioContext

            )();

        }


        const oscillator =

        audioContext
        .createOscillator();


        const gain =

        audioContext
        .createGain();


        oscillator.connect(
        gain
        );


        gain.connect(

        audioContext.destination

        );


        oscillator.frequency.value =
        550;


        gain.gain.setValueAtTime(

            0.04,

            audioContext.currentTime

        );


        gain.gain.exponentialRampToValueAtTime(

            0.001,

            audioContext.currentTime +
            .4

        );


        oscillator.start();


        oscillator.stop(

            audioContext.currentTime +
            .4

        );


    }

    catch(error){

    }

}

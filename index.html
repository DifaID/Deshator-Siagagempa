<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>WORLD DISASTER RADAR V3</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

*{
box-sizing:border-box;
}

html,body{
margin:0;
width:100%;
height:100%;
background:#020609;
font-family:Arial,sans-serif;
color:white;
overflow:hidden;
}

/* HEADER */

#header{
position:fixed;
top:0;
left:0;
width:100%;
height:60px;
z-index:2000;

background:#050b0f;

border-bottom:1px solid #123844;

display:flex;
align-items:center;
justify-content:space-between;

padding:0 12px;
}

#title{
font-weight:bold;
font-size:16px;
letter-spacing:1px;
color:#00eaff;
}

#live{
font-size:10px;
color:#00ff88;
}

#clock{
font-size:11px;
color:#9ddbe5;
}


/* MAP */

#map{
position:absolute;
top:60px;
bottom:110px;
width:100%;
background:#020609;
}


/* STATUS */

#status{
position:fixed;

top:70px;
left:10px;

z-index:1500;

background:rgba(0,0,0,.85);

border:1px solid #164653;

padding:8px;

border-radius:8px;

font-size:10px;

color:#00ff88;
}


/* CANVAS */

#waveCanvas{

position:absolute;

top:60px;

left:0;

width:100%;

height:calc(100% - 170px);

z-index:500;

pointer-events:none;

}


/* LEGEND */

#legend{

position:fixed;

top:70px;
right:10px;

z-index:1500;

background:rgba(0,0,0,.85);

border:1px solid #164653;

border-radius:8px;

padding:8px;

font-size:9px;

line-height:1.8;

}

.dot{

width:8px;
height:8px;

border-radius:50%;

display:inline-block;

margin-right:4px;

}

.red{
background:red;
}

.orange{
background:orange;
}

.yellow{
background:#ffd000;
}


/* BOTTOM */

#bottom{

position:fixed;

bottom:0;

left:0;

width:100%;

height:110px;

z-index:2000;

background:#050b0f;

border-top:1px solid #123844;

}


/* STATS */

#stats{

height:45px;

display:grid;

grid-template-columns:
repeat(4,1fr);

border-bottom:
1px solid #102b34;

}

.stat{

text-align:center;

padding-top:6px;

border-right:
1px solid #102b34;

}

.stat:last-child{
border:none;
}

.label{

font-size:8px;

color:#70818a;

}

.value{

font-size:13px;

font-weight:bold;

margin-top:4px;

color:#00eaff;

}


/* FEED */

#feed{

height:65px;

overflow-x:auto;

white-space:nowrap;

padding:7px;

}

.feedItem{

display:inline-block;

width:180px;

height:48px;

margin-right:6px;

padding:6px;

background:#081318;

border:1px solid #10333d;

border-radius:7px;

vertical-align:top;

white-space:normal;

overflow:hidden;

}

.mag{

color:#ff4444;

font-size:14px;

font-weight:bold;

}

.place{

font-size:9px;

color:#ddd;

white-space:nowrap;

overflow:hidden;

text-overflow:ellipsis;

margin-top:3px;

}


/* EARTHQUAKE MARKER */

.eq{

width:12px;

height:12px;

background:#ff2020;

border:2px solid white;

border-radius:50%;

box-shadow:
0 0 8px red;

}


/* VOLCANO MARKER */

.volcano{

width:18px;

height:18px;

display:flex;

align-items:center;

justify-content:center;

font-size:13px;

filter:
drop-shadow(0 0 5px orange);

}


/* POPUP */

.leaflet-popup-content-wrapper{

background:#071116;

color:white;

border:1px solid #15505e;

}

.leaflet-popup-tip{

background:#071116;

}


/* MOBILE */

@media(max-width:600px){

#title{
font-size:13px;
}

#clock{
display:none;
}

#legend{
font-size:8px;
}

}

</style>

</head>

<body>


<div id="header">

<div id="title">
🌍 DISASTER RADAR V3
</div>

<div id="live">
● LIVE DATA
</div>

<div id="clock"></div>

</div>


<div id="status">
🟡 MEMUAT DATA...
</div>


<div id="legend">

<div>
<span class="dot red"></span>
GEMPA BARU
</div>

<div>
<span class="dot orange"></span>
GUNUNG AKTIF
</div>

<div>
⭕ GELOMBANG BARU
</div>

</div>


<div id="map"></div>

<canvas id="waveCanvas"></canvas>


<div id="bottom">


<div id="stats">


<div class="stat">

<div class="label">
GEMPA
</div>

<div class="value"
id="eqCount">
0
</div>

</div>


<div class="stat">

<div class="label">
TERBESAR
</div>

<div class="value"
id="maxMag">
-
</div>

</div>


<div class="stat">

<div class="label">
GUNUNG AKTIF
</div>

<div class="value"
id="volCount">
0
</div>

</div>


<div class="stat">

<div class="label">
UPDATE
</div>

<div class="value"
id="update">
-
</div>

</div>


</div>


<div id="feed"></div>


</div>


<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>


/* =====================
CONFIG
===================== */

const EARTHQUAKE_URL =
"https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_hour.geojson";


const VOLCANO_URL =
"https://volcanoes.usgs.gov/hans-public/api/volcano/getElevatedVolcanoes";


const REFRESH_TIME =
60000;


const MAX_EARTHQUAKES =
15;


/* =====================
MAP
===================== */

const map =
L.map(
"map",
{
zoomControl:true,
worldCopyJump:true,
preferCanvas:true
}
)
.setView(
[20,0],
2
);


L.tileLayer(

"https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",

{

maxZoom:18,

updateWhenIdle:true,

keepBuffer:1,

attribution:
"© OpenStreetMap © CARTO"

}

)
.addTo(map);


const earthquakeLayer =
L.layerGroup()
.addTo(map);


const volcanoLayer =
L.layerGroup()
.addTo(map);


/* =====================
STATUS
===================== */

function setStatus(text,color){

const el =
document.getElementById(
"status"
);

el.innerText =
text;

el.style.color =
color;

}


/* =====================
KNOWN EVENTS

Menyimpan ID gempa
agar gelombang hanya
muncul untuk event baru

===================== */

let knownEarthquakes =
new Set();


/* =====================
LOAD GEMPA
===================== */

async function loadEarthquakes(){

try{


setStatus(
"🟡 MENGAMBIL GEMPA...",
"#ffd000"
);


const res =
await fetch(
EARTHQUAKE_URL
);


const data =
await res.json();


let earthquakes =
data.features
.filter(eq =>
eq.properties.mag !== null
)
.sort((a,b)=>
b.properties.time -
a.properties.time
)
.slice(
0,
MAX_EARTHQUAKES
);


earthquakeLayer.clearLayers();


const feed =
document.getElementById(
"feed"
);


feed.innerHTML =
"";


let maxMag =
0;


earthquakes.forEach(eq => {


const p =
eq.properties;


const c =
eq.geometry.coordinates;


const lng =
c[0];


const lat =
c[1];


const depth =
c[2];


const mag =
p.mag;


/* MAX */

if(
mag > maxMag
){

maxMag =
mag;

}


/* MARKER */

const marker =
L.marker(
[lat,lng],
{

icon:
L.divIcon({

className:"",

html:
'<div class="eq"></div>',

iconSize:
[12,12],

iconAnchor:
[6,6]

})

}

);


/* POPUP */

marker.bindPopup(

'<b style="color:#ff5555">' +

'🔴 GEMPA BUMI' +

'</b><br><br>' +

'📍 ' +

(p.place ||
"Unknown") +

'<br>' +

'📊 Magnitudo: M ' +
mag +

'<br>' +

'⬇ Kedalaman: ' +
depth +
' km' +

'<br>' +

'🕒 ' +

new Date(p.time)
.toLocaleString(
"id-ID"
)

);


marker.addTo(
earthquakeLayer
);


/* =====================

GEMPA BARU

Hanya animasi
jika ID belum ada

===================== */

if(
!knownEarthquakes.has(
eq.id
)
){

createWave(
lat,
lng,
mag
);


knownEarthquakes.add(
eq.id
);

}


/* FEED */

const item =
document.createElement(
"div"
);


item.className =
"feedItem";


item.innerHTML =

'<div class="mag">' +

'M ' +
mag +

'</div>' +

'<div class="place">' +

'📍 ' +
(p.place ||
"Unknown") +

'</div>';


feed.appendChild(
item
);


});


/* BATASI MEMORY */

if(
knownEarthquakes.size >
100
){

knownEarthquakes =
new Set(
earthquakes.map(
eq => eq.id
)
);

}


/* STATS */

document
.getElementById(
"eqCount"
)
.innerText =
earthquakes.length;


document
.getElementById(
"maxMag"
)
.innerText =
"M " +
maxMag;


/* UPDATE */

document
.getElementById(
"update"
)
.innerText =

new Date()
.toLocaleTimeString(
"id-ID"
);


setStatus(
"🟢 GEMPA LIVE",
"#00ff88"
);


}

catch(error){


console.error(
error
);


setStatus(
"🔴 GAGAL DATA GEMPA",
"#ff4444"
);


}

}


/* =====================
VOLCANO

Hanya elevated volcano
dari USGS

===================== */

async function loadVolcanoes(){

try{


const res =
await fetch(
VOLCANO_URL
);


const data =
await res.json();


volcanoLayer.clearLayers();


let count = 0;


/*
API bisa memiliki
format array berbeda

*/

const volcanoes =
Array.isArray(data)

?

data

:

data.volcanoes ||
[];


volcanoes.forEach(v => {


const lat =

v.latitude ||
v.lat;


const lng =

v.longitude ||
v.lon ||
v.lng;


/* CEK */

if(
lat == null ||
lng == null
){

return;

}


count++;


const name =

v.volcanoName ||

v.name ||

"Volcano";


const country =

v.country ||

"-";


const colorCode =

v.colorCode ||

v.color_code ||

"";


const alertLevel =

v.alertLevel ||

v.alert_level ||

"";


const ashInfo =

v.ash ||

v.ashInfo ||

v.plume ||

"Data abu tidak tersedia";


const marker =
L.marker(
[lat,lng],
{

icon:
L.divIcon({

className:"",

html:
'<div class="volcano">🌋</div>',

iconSize:
[18,18],

iconAnchor:
[9,9]

})

}

);


marker.bindPopup(

'<b style="color:orange">' +

'🌋 ' +
name +

'</b><br><br>' +

'🌍 Negara: ' +
country +

'<br>' +

'🚨 Status: ' +
colorCode +

'<br>' +

'⚠️ Level: ' +
alertLevel +

'<br>' +

'☁️ Abu: ' +
ashInfo

);


marker.addTo(
volcanoLayer
);


});


document
.getElementById(
"volCount"
)
.innerText =
count;


}

catch(error){


console.log(
"VOLCANO DATA ERROR",
error
);


/*
Tidak membuat web
error jika API gunung
sedang tidak bisa diakses
*/

}

}


/* =====================
CANVAS WAVE

Lebih ringan
dibanding Leaflet circles

===================== */

const canvas =
document.getElementById(
"waveCanvas"
);


const ctx =
canvas.getContext(
"2d"
);


let waves = [];


/* RESIZE */

function resizeCanvas(){

const rect =
canvas.getBoundingClientRect();


canvas.width =
rect.width *
devicePixelRatio;


canvas.height =
rect.height *
devicePixelRatio;


ctx.setTransform(
devicePixelRatio,
0,
0,
devicePixelRatio,
0,
0
);

}


window.addEventListener(
"resize",
resizeCanvas
);


resizeCanvas();


/* CREATE WAVE */

function createWave(
lat,
lng,
mag
){


const point =
map.latLngToContainerPoint(
[lat,lng]
);


/*
Canvas koordinat
sama dengan map

*/


waves.push({

lat:lat,

lng:lng,

radius:5,

maxRadius:

100 +

Math.max(
50,
mag * 40
),

alpha:1

});


}


/* ANIMATE */

function animateWaves(){


ctx.clearRect(

0,
0,

canvas.width,
canvas.height

);


waves.forEach(w => {


const point =
map.latLngToContainerPoint(
[w.lat,w.lng]
);


ctx.beginPath();


ctx.arc(

point.x,

point.y,

w.radius,

0,

Math.PI * 2

);


ctx.strokeStyle =

"rgba(255,40,40," +
w.alpha +
")";


ctx.lineWidth =
2;


ctx.stroke();


w.radius +=
2.2;


w.alpha -=
0.015;


});


waves =
waves.filter(w =>

w.alpha > 0

&&

w.radius <
w.maxRadius

);


requestAnimationFrame(
animateWaves
);


}


animateWaves();


/* =====================
UPDATE CANVAS
SAAT MAP BERGERAK

===================== */

map.on(
"move zoom",
function(){

resizeCanvas();

}
);


/* =====================
CLOCK
===================== */

function updateClock(){

document
.getElementById(
"clock"
)
.innerText =

new Date()
.toLocaleTimeString(
"id-ID"
);

}


setInterval(
updateClock,
1000
);


updateClock();


/* =====================
LOAD ALL

===================== */

async function loadAll(){

await Promise.all([

loadEarthquakes(),

loadVolcanoes()

]);

}


/* START */

loadAll();


setInterval(

loadAll,

REFRESH_TIME

);


</script>

</body>
</html>

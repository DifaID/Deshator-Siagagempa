<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>INDONESIA EARTHQUAKE RADAR V6</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#020609;
    color:white;
    font-family:Arial,sans-serif;
}

/* ================= HEADER ================= */

#header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:56px;
    z-index:3000;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 12px;

    background:#050b0f;

    border-bottom:
    1px solid #12404d;
}

#title{
    font-size:13px;
    font-weight:bold;
    color:#00eaff;
}

#live{
    font-size:9px;
    color:#00ff88;
}

/* ================= MAP ================= */

#map{
    position:absolute;

    top:56px;

    bottom:130px;

    width:100%;
}

/* ================= STATUS ================= */

#status{
    position:fixed;

    top:66px;
    left:8px;

    z-index:2000;

    background:
    rgba(0,10,15,.93);

    border:
    1px solid #15505e;

    border-radius:8px;

    padding:7px;

    font-size:9px;
}

/* ================= LOCATION ================= */

#locationPanel{
    position:fixed;

    top:102px;
    left:8px;

    z-index:2000;

    max-width:190px;

    background:
    rgba(0,10,15,.93);

    border:
    1px solid #15505e;

    border-radius:8px;

    padding:8px;

    font-size:8px;

    line-height:1.7;
}

#locationTitle{
    color:#00eaff;
    font-weight:bold;
}

/* ================= LEGEND ================= */

#legend{
    position:fixed;

    top:66px;
    right:8px;

    z-index:2000;

    background:
    rgba(0,10,15,.93);

    border:
    1px solid #15505e;

    border-radius:8px;

    padding:7px;

    font-size:8px;

    line-height:1.9;
}

.dot{
    width:8px;
    height:8px;

    border-radius:50%;

    display:inline-block;

    margin-right:4px;
}

.blue{
    background:#008cff;
}

.red{
    background:red;
}

.orange{
    background:#ff9500;
}

/* ================= BOTTOM ================= */

#bottom{
    position:fixed;

    bottom:0;
    left:0;

    width:100%;
    height:130px;

    z-index:3000;

    background:#050b0f;

    border-top:
    1px solid #12404d;
}

/* ================= STATS ================= */

#stats{
    height:48px;

    display:grid;

    grid-template-columns:
    repeat(4,1fr);

    border-bottom:
    1px solid #102f38;
}

.stat{
    text-align:center;

    padding-top:7px;

    border-right:
    1px solid #102f38;
}

.stat:last-child{
    border:none;
}

.label{
    font-size:7px;
    color:#71878e;
}

.value{
    margin-top:5px;

    font-size:11px;

    font-weight:bold;

    color:#00eaff;
}

/* ================= FEED ================= */

#feed{
    height:82px;

    overflow-x:auto;

    white-space:nowrap;

    padding:7px;
}

.feedItem{
    display:inline-block;

    vertical-align:top;

    width:210px;
    height:63px;

    margin-right:7px;

    padding:7px;

    background:#071318;

    border:
    1px solid #10343e;

    border-radius:8px;

    white-space:normal;
}

.feedMag{
    color:#ff4444;

    font-size:14px;

    font-weight:bold;
}

.feedPlace{
    margin-top:4px;

    font-size:8px;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.feedDistance{
    margin-top:4px;

    font-size:8px;

    color:#00eaff;
}

/* ================= GEMPA MARKER ================= */

.eqMarker{
    width:13px;
    height:13px;

    background:#ff2020;

    border-radius:50%;

    border:
    2px solid white;

    box-shadow:
    0 0 8px red,
    0 0 18px red;
}

/* ================= USER MARKER ================= */

.userMarker{
    width:18px;
    height:18px;

    background:#008cff;

    border-radius:50%;

    border:
    3px solid white;

    box-shadow:
    0 0 10px #008cff,
    0 0 22px #008cff;
}

/* ================= CANVAS ================= */

#waveCanvas{
    position:absolute;

    top:56px;
    left:0;

    width:100%;

    height:
    calc(100% - 186px);

    z-index:500;

    pointer-events:none;
}

/* ================= SOURCE ================= */

#source{
    position:fixed;

    bottom:132px;
    right:6px;

    z-index:2000;

    font-size:7px;

    color:#778b91;

    background:
    rgba(0,0,0,.55);

    padding:4px;

    border-radius:5px;
}

</style>

</head>

<body>


<!-- HEADER -->

<div id="header">

    <div id="title">
        🇮🇩 EARTHQUAKE RADAR V6
    </div>

    <div id="live">
        ● BMKG LIVE
    </div>

</div>


<!-- STATUS -->

<div id="status">
    🟡 MEMUAT DATA BMKG...
</div>


<!-- LOCATION -->

<div id="locationPanel">

    <div id="locationTitle">
        📍 LOKASI KAMU
    </div>

    <div id="userInfo">
        Mencari GPS...
    </div>

</div>


<!-- LEGEND -->

<div id="legend">

    <div>
        <span class="dot blue"></span>
        LOKASI KAMU
    </div>

    <div>
        <span class="dot red"></span>
        GEMPA
    </div>

    <div>
        ⭕ GELOMBANG BARU
    </div>

</div>


<!-- MAP -->

<div id="map"></div>


<!-- WAVE -->

<canvas id="waveCanvas"></canvas>


<!-- SOURCE -->

<div id="source">
    Sumber Data: BMKG
</div>


<!-- BOTTOM -->

<div id="bottom">


<div id="stats">

    <div class="stat">

        <div class="label">
            GEMPA
        </div>

        <div
        class="value"
        id="eqCount">
            0
        </div>

    </div>


    <div class="stat">

        <div class="label">
            TERBESAR
        </div>

        <div
        class="value"
        id="maxMag">
            -
        </div>

    </div>


    <div class="stat">

        <div class="label">
            TERDEKAT
        </div>

        <div
        class="value"
        id="nearest">
            -
        </div>

    </div>


    <div class="stat">

        <div class="label">
            UPDATE
        </div>

        <div
        class="value"
        id="update">
            -
        </div>

    </div>

</div>


<div id="feed"></div>


</div>



<!-- LEAFLET -->

<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>

/* =====================================
DATA BMKG

TANPA API KEY

===================================== */

const BMKG_AUTO =
"https://data.bmkg.go.id/DataMKG/TEWS/autogempa.json";


const BMKG_M5 =
"https://data.bmkg.go.id/DataMKG/TEWS/gempaterkini.json";


const BMKG_FELT =
"https://data.bmkg.go.id/DataMKG/TEWS/gempadirasakan.json";


/* Update setiap 60 detik */

const REFRESH_TIME =
60000;


/* =====================================
MAP

===================================== */

const map =

L.map(

"map",

{

preferCanvas:true,

fadeAnimation:false,

markerZoomAnimation:false,

zoomControl:true,

minZoom:4,

maxZoom:10

}

);


/* FOKUS INDONESIA */

map.setView(

[-2.5,118],

5

);


/* BATAS PETA */

map.setMaxBounds(

[

[-15,90],

[12,145]

]

);


/* TILE RINGAN */

L.tileLayer(

"https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",

{

maxZoom:18,

keepBuffer:1,

updateWhenIdle:true,

attribution:
"© OpenStreetMap © CARTO"

}

).addTo(map);


/* =====================================
LAYER

===================================== */

const earthquakeLayer =
L.layerGroup().addTo(map);

const userLayer =
L.layerGroup().addTo(map);


/* =====================================
USER GPS

===================================== */

let userLat = null;
let userLng = null;


/* =====================================
STATUS

===================================== */

function setStatus(text,color){

const el =
document.getElementById("status");

el.innerText = text;

el.style.color =
color || "#00ff88";

}


/* =====================================
GET GPS

===================================== */

function getUserLocation(){

if(!navigator.geolocation){

document.getElementById(
"userInfo"
).innerHTML =
"❌ GPS tidak didukung";

return;

}


navigator.geolocation.getCurrentPosition(

position => {


userLat =
position.coords.latitude;

userLng =
position.coords.longitude;


const accuracy =
Math.round(
position.coords.accuracy
);


/* CLEAR USER */

userLayer.clearLayers();


/* USER MARKER */

const marker =

L.marker(

[userLat,userLng],

{

icon:

L.divIcon({

className:"",

html:
'<div class="userMarker"></div>',

iconSize:
[18,18],

iconAnchor:
[9,9]

})

}

);


marker.bindPopup(

"<b>📍 LOKASI KAMU</b><br><br>" +

"Latitude: " +
userLat.toFixed(4) +

"<br>" +

"Longitude: " +
userLng.toFixed(4) +

"<br>" +

"🎯 Akurasi ±" +
accuracy +
" meter"

);


marker.addTo(
userLayer
);


/* GPS ACCURACY */

L.circle(

[userLat,userLng],

{

radius:accuracy,

color:"#008cff",

weight:1,

opacity:.5,

fillOpacity:.08

}

)

.addTo(
userLayer
);


/* INFO */

document.getElementById(
"userInfo"
).innerHTML =

"🟢 GPS Aktif<br>" +

"🎯 Akurasi ±" +
accuracy +
" meter";


},

error => {

document.getElementById(
"userInfo"
).innerHTML =

"⚠️ Izinkan lokasi GPS";

console.log(error);

},

{

enableHighAccuracy:true,

timeout:10000,

maximumAge:60000

}

);

}


/* =====================================
DISTANCE

===================================== */

function getDistance(

lat1,
lon1,
lat2,
lon2

){

const R = 6371;

const dLat =
(lat2-lat1) *
Math.PI/180;

const dLon =
(lon2-lon1) *
Math.PI/180;


const a =

Math.sin(dLat/2) *
Math.sin(dLat/2)

+

Math.cos(
lat1*Math.PI/180
)

*

Math.cos(
lat2*Math.PI/180
)

*

Math.sin(dLon/2) *
Math.sin(dLon/2);


const c =

2 *

Math.atan2(

Math.sqrt(a),

Math.sqrt(1-a)

);


return R*c;

}


/* =====================================
DIRECTION

===================================== */

function getDirection(

lat1,
lon1,
lat2,
lon2

){

const y =

Math.sin(
(lon2-lon1) *
Math.PI/180
)

*

Math.cos(
lat2*Math.PI/180
);


const x =

Math.cos(
lat1*Math.PI/180
)

*

Math.sin(
lat2*Math.PI/180
)

-

Math.sin(
lat1*Math.PI/180
)

*

Math.cos(
lat2*Math.PI/180
)

*

Math.cos(
(lon2-lon1) *
Math.PI/180
);


let bearing =

Math.atan2(y,x) *
180/Math.PI;


bearing =
(bearing+360)%360;


const dirs =

[

"Utara",
"Timur Laut",
"Timur",
"Tenggara",
"Selatan",
"Barat Daya",
"Barat",
"Barat Laut"

];


return dirs[
Math.round(
bearing/45
)%8
];

}


/* =====================================
PARSE KOORDINAT BMKG

Format:

latitude,longitude

Contoh:

-7.21,105.12

===================================== */

function parseCoordinates(text){

if(!text) return null;

const parts =
text.split(",");

if(parts.length < 2)
return null;


const lat =
parseFloat(
parts[0]
.trim()
);

const lng =
parseFloat(
parts[1]
.trim()
);


if(
isNaN(lat)
||
isNaN(lng)
){

return null;

}


return {

lat:lat,

lng:lng

};

}


/* =====================================
ID GEMPA

===================================== */

function getEarthquakeID(g){

return (

g.DateTime ||

""

)

+

"_"

+

(

g.Coordinates ||

""

);

}


/* =====================================
KNOWN GEMPA

===================================== */

let knownEarthquakes =
new Set();


/* =====================================
LOAD DATA BMKG

===================================== */

async function loadBMKG(){

try{


setStatus(

"🟡 MENGAMBIL DATA BMKG...",

"#ffd000"

);


/* AMBIL 3 DATA */

const results =

await Promise.allSettled(

[

fetch(
BMKG_AUTO,
{
cache:"no-store"
}
),

fetch(
BMKG_M5,
{
cache:"no-store"
}
),

fetch(
BMKG_FELT,
{
cache:"no-store"
}
)

]

);


/* =====================================
PARSE JSON

===================================== */

let autoGempa = null;

let gempaM5 = [];

let gempaFelt = [];


/* AUTO */

if(
results[0].status ===
"fulfilled"
){

const data =

await results[0]
.value
.json();


autoGempa =

data.Infogempa.gempa;

}


/* M5 */

if(
results[1].status ===
"fulfilled"
){

const data =

await results[1]
.value
.json();


gempaM5 =

data.Infogempa.gempa ||
[];

}


/* FELT */

if(
results[2].status ===
"fulfilled"
){

const data =

await results[2]
.value
.json();


gempaFelt =

data.Infogempa.gempa ||
[];

}


/* =====================================
GABUNG DATA

===================================== */

let earthquakes = [];


/* AUTO */

if(autoGempa){

earthquakes.push(

{

...autoGempa,

type:"TERBARU"

}

);

}


/* M5 */

gempaM5.forEach(

g => {

earthquakes.push(

{

...g,

type:"M5+"

}

);

}

);


/* FELT */

gempaFelt.forEach(

g => {

earthquakes.push(

{

...g,

type:"DIRASAKAN"

}

);

}

);


/* =====================================
HAPUS DUPLIKAT

===================================== */

const unique =

new Map();


earthquakes.forEach(

g => {

const id =
getEarthquakeID(g);


if(!unique.has(id)){

unique.set(
id,
g
);

}

}

);


earthquakes =

Array.from(
unique.values()
);


/* MAKSIMAL 20 */

earthquakes =
earthquakes.slice(
0,
20
);


/* =====================================
CLEAR MAP

===================================== */

earthquakeLayer.clearLayers();


const feed =
document.getElementById(
"feed"
);

feed.innerHTML = "";


/* =====================================
STATS

===================================== */

let maxMag = 0;

let nearestDistance =
Infinity;


/* =====================================
LOOP GEMPA

===================================== */

earthquakes.forEach(

g => {


const coords =

parseCoordinates(
g.Coordinates
);


if(!coords)
return;


const lat =
coords.lat;

const lng =
coords.lng;


const mag =
parseFloat(
g.Magnitude
) || 0;


/* MAX MAG */

if(mag > maxMag){

maxMag = mag;

}


/* DISTANCE */

let distanceText =
"GPS belum aktif";

let directionText =
"";


if(

userLat !== null

&&

userLng !== null

){

const distance =

getDistance(

userLat,
userLng,

lat,
lng

);


distanceText =

Math.round(distance) +
" km";


directionText =

getDirection(

userLat,
userLng,

lat,
lng

);


/* NEAREST */

if(
distance <
nearestDistance
){

nearestDistance =
distance;

}

}


/* =====================================
MARKER

===================================== */

const marker =

L.marker(

[lat,lng],

{

icon:

L.divIcon({

className:"",

html:
'<div class="eqMarker"></div>',

iconSize:
[13,13],

iconAnchor:
[6,6]

})

}

);


/* =====================================
POPUP

===================================== */

marker.bindPopup(

"<b style='color:#ff4444'>" +

"🔴 GEMPA BMKG" +

"</b><br><br>" +

"📍 " +

(g.Wilayah ||
"Indonesia") +

"<br><br>" +

"📊 Magnitudo: M " +
g.Magnitude +

"<br>" +

"⬇ Kedalaman: " +
g.Kedalaman +

"<br>" +

"🕒 " +
g.Tanggal +

" " +
g.Jam +

"<br>" +

"📏 Jarak: " +
distanceText +

"<br>" +

"🧭 Arah: " +
directionText +

"<br>" +

"⚠️ " +
(g.Potensi ||
"-") +

"<br>" +

"📳 " +
(g.Dirasakan ||
"Tidak ada laporan")

);


marker.addTo(
earthquakeLayer
);


/* =====================================
GEMPA BARU

===================================== */

const id =
getEarthquakeID(g);


if(
!knownEarthquakes.has(id)
){

createWave(

lat,
lng,
mag

);

}


/* =====================================
FEED

===================================== */

const item =

document.createElement(
"div"
);


item.className =
"feedItem";


item.innerHTML =

'<div class="feedMag">' +

'M ' +
g.Magnitude +

' <span style="font-size:8px;color:#ff9500">' +

g.type +

'</span>' +

'</div>' +

'<div class="feedPlace">' +

'📍 ' +

(g.Wilayah ||
"Indonesia") +

'</div>' +

'<div class="feedDistance">' +

'📏 ' +
distanceText +

(
directionText

?

' • ' +
directionText

:
''
) +

'</div>';


feed.appendChild(
item
);


});


/* =====================================
UPDATE KNOWN

===================================== */

knownEarthquakes =

new Set(

earthquakes.map(

g =>
getEarthquakeID(g)

)

);


/* =====================================
UPDATE STATS

===================================== */

document.getElementById(
"eqCount"
).innerText =
earthquakes.length;


document.getElementById(
"maxMag"
).innerText =

maxMag

?

"M " +
maxMag

:
"-";


document.getElementById(
"nearest"
).innerText =

nearestDistance !== Infinity

?

Math.round(
nearestDistance
) +
" km"

:
"-";


document.getElementById(
"update"
).innerText =

new Date()

.toLocaleTimeString(

"id-ID",

{

hour:"2-digit",

minute:"2-digit"

}

);


/* =====================================
STATUS

===================================== */

setStatus(

"🟢 BMKG LIVE • " +

earthquakes.length +

" DATA",

"#00ff88"

);


}

catch(error){

console.error(error);


setStatus(

"🔴 GAGAL AMBIL DATA",

"#ff4444"

);

}

}


/* =====================================
CANVAS WAVE

===================================== */

const canvas =

document.getElementById(
"waveCanvas"
);


const ctx =
canvas.getContext(
"2d"
);


let waves = [];


/* =====================================
RESIZE

===================================== */

function resizeCanvas(){

const rect =
canvas.getBoundingClientRect();


const ratio =

Math.min(

window.devicePixelRatio ||
1,

2

);


canvas.width =
rect.width *
ratio;


canvas.height =
rect.height *
ratio;


ctx.setTransform(

ratio,
0,
0,
ratio,
0,
0

);

}


resizeCanvas();


window.addEventListener(

"resize",

resizeCanvas

);


/* =====================================
CREATE WAVE

===================================== */

function createWave(

lat,
lng,
mag

){

waves.push({

lat:lat,

lng:lng,

radius:8,

alpha:1,

maxRadius:

Math.min(

180,

70 +
mag * 20

)

});

}


/* =====================================
ANIMATION

30 FPS

===================================== */

let lastFrame = 0;


function animateWaves(time){

if(
time - lastFrame < 33
){

requestAnimationFrame(
animateWaves
);

return;

}


lastFrame = time;


const rect =
canvas.getBoundingClientRect();


ctx.clearRect(

0,
0,

rect.width,
rect.height

);


waves.forEach(

wave => {


const point =

map.latLngToContainerPoint(

[

wave.lat,

wave.lng

]

);


/* GAMBAR */

ctx.beginPath();


ctx.arc(

point.x,

point.y,

wave.radius,

0,

Math.PI * 2

);


ctx.strokeStyle =

"rgba(255,30,30," +

wave.alpha +

")";


ctx.lineWidth =
2;


ctx.stroke();


/* ANIMASI */

wave.radius +=
2.2;


wave.alpha -=
0.02;


}

);


/* HAPUS WAVE */

waves =

waves.filter(

wave =>

wave.alpha > 0

&&

wave.radius <
wave.maxRadius

);


requestAnimationFrame(
animateWaves
);

}


requestAnimationFrame(
animateWaves
);


/* =====================================
START

===================================== */


/* GPS */

getUserLocation();


/* DATA BMKG */

loadBMKG();


/* AUTO UPDATE */

setInterval(

loadBMKG,

REFRESH_TIME

);


</script>

</body>
</html>

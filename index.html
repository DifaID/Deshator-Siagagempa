<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>INDONESIA DISASTER RADAR V5</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#020609;
    color:white;
    font-family:Arial,sans-serif;
}

/* HEADER */

#header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:55px;
    z-index:3000;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 12px;

    background:#050b0f;
    border-bottom:1px solid #12404d;
}

#title{
    color:#00eaff;
    font-size:14px;
    font-weight:bold;
}

#live{
    color:#00ff88;
    font-size:9px;
}

/* MAP */

#map{
    position:absolute;
    top:55px;
    bottom:120px;
    width:100%;
}

/* STATUS */

#status{
    position:fixed;
    top:65px;
    left:8px;
    z-index:2000;

    background:rgba(0,10,15,.92);
    border:1px solid #15505e;

    border-radius:7px;
    padding:7px;

    font-size:9px;
}

/* LOCATION */

#locationPanel{
    position:fixed;
    top:100px;
    left:8px;
    z-index:2000;

    background:rgba(0,10,15,.92);
    border:1px solid #15505e;

    border-radius:7px;
    padding:7px;

    font-size:8px;
}

#locationTitle{
    color:#00eaff;
    font-weight:bold;
    margin-bottom:4px;
}

/* LEGEND */

#legend{
    position:fixed;
    top:65px;
    right:8px;
    z-index:2000;

    background:rgba(0,10,15,.92);
    border:1px solid #15505e;

    border-radius:7px;
    padding:7px;

    font-size:8px;
    line-height:1.8;
}

.dot{
    width:8px;
    height:8px;
    border-radius:50%;
    display:inline-block;
    margin-right:4px;
}

.blue{
    background:#008cff;
}

.red{
    background:red;
}

/* BOTTOM */

#bottom{
    position:fixed;
    bottom:0;
    left:0;

    width:100%;
    height:120px;

    z-index:3000;

    background:#050b0f;

    border-top:1px solid #12404d;
}

/* STATS */

#stats{
    height:45px;

    display:grid;

    grid-template-columns:
    repeat(4,1fr);

    border-bottom:1px solid #102f38;
}

.stat{
    text-align:center;
    padding-top:6px;

    border-right:1px solid #102f38;
}

.stat:last-child{
    border:none;
}

.label{
    font-size:8px;
    color:#71878e;
}

.value{
    margin-top:4px;
    font-size:12px;
    font-weight:bold;
    color:#00eaff;
}

/* FEED */

#feed{
    height:75px;
    overflow-x:auto;
    white-space:nowrap;
    padding:7px;
}

.feedItem{
    display:inline-block;
    vertical-align:top;

    width:190px;
    height:57px;

    margin-right:6px;
    padding:7px;

    background:#071318;

    border:1px solid #10343e;

    border-radius:7px;

    white-space:normal;
}

.feedMag{
    color:#ff4444;
    font-weight:bold;
    font-size:13px;
}

.feedPlace{
    font-size:8px;
    margin-top:4px;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.feedDistance{
    color:#00eaff;
    font-size:8px;
    margin-top:4px;
}

/* MARKER GEMPA */

.eqMarker{
    width:12px;
    height:12px;

    background:red;

    border:2px solid white;

    border-radius:50%;

    box-shadow:
    0 0 7px red;
}

/* MARKER USER */

.userMarker{
    width:17px;
    height:17px;

    background:#008cff;

    border:3px solid white;

    border-radius:50%;

    box-shadow:
    0 0 10px #008cff;
}

/* CANVAS */

#waveCanvas{
    position:absolute;

    top:55px;
    left:0;

    width:100%;
    height:calc(100% - 175px);

    z-index:500;

    pointer-events:none;
}

/* MOBILE */

@media(max-width:600px){

    #title{
        font-size:12px;
    }

}

</style>
</head>

<body>


<!-- HEADER -->

<div id="header">

    <div id="title">
        🇮🇩 INDONESIA DISASTER RADAR
    </div>

    <div id="live">
        ● LIVE
    </div>

</div>


<!-- STATUS -->

<div id="status">
    🟡 MEMUAT...
</div>


<!-- LOCATION -->

<div id="locationPanel">

    <div id="locationTitle">
        📍 LOKASI KAMU
    </div>

    <div id="userInfo">
        Mencari GPS...
    </div>

</div>


<!-- LEGEND -->

<div id="legend">

    <div>
        <span class="dot blue"></span>
        KAMU
    </div>

    <div>
        <span class="dot red"></span>
        GEMPA
    </div>

    <div>
        ⭕ GELOMBANG BARU
    </div>

</div>


<!-- MAP -->

<div id="map"></div>


<!-- CANVAS -->

<canvas id="waveCanvas"></canvas>


<!-- BOTTOM -->

<div id="bottom">


<div id="stats">


    <div class="stat">

        <div class="label">
            GEMPA
        </div>

        <div class="value" id="eqCount">
            0
        </div>

    </div>


    <div class="stat">

        <div class="label">
            TERBESAR
        </div>

        <div class="value" id="maxMag">
            -
        </div>

    </div>


    <div class="stat">

        <div class="label">
            TERDEKAT
        </div>

        <div class="value" id="nearest">
            -
        </div>

    </div>


    <div class="stat">

        <div class="label">
            UPDATE
        </div>

        <div class="value" id="update">
            -
        </div>

    </div>


</div>


<div id="feed"></div>


</div>



<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script>

/* =====================================
CONFIG
===================================== */

const EARTHQUAKE_URL =
"https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_hour.geojson";


const REFRESH_TIME = 60000;

const MAX_EARTHQUAKES = 12;


/* =====================================
BATAS INDONESIA

Barat sampai Timur
Aceh sampai Papua

===================================== */

const INDONESIA_BOUNDS = {

minLat:-15,

maxLat:12,

minLng:90,

maxLng:145

};


/* =====================================
MAP

===================================== */

const map = L.map(

"map",

{

preferCanvas:true,

zoomControl:true,

fadeAnimation:false,

markerZoomAnimation:false

}

);


/* Fokus Indonesia */

map.setView(

[-2.5,118],

5

);


/* BATASI MAP AGAR
TIDAK TERLALU JAUH */

map.setMaxBounds(

[

[-15,90],

[12,145]

]

);


/* TILE */

L.tileLayer(

"https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",

{

maxZoom:18,

keepBuffer:1,

updateWhenIdle:true,

attribution:
"© OpenStreetMap © CARTO"

}

).addTo(map);


/* LAYER */

const earthquakeLayer =
L.layerGroup().addTo(map);

const userLayer =
L.layerGroup().addTo(map);


/* =====================================
STATUS

===================================== */

function setStatus(text,color){

const el =
document.getElementById("status");

el.innerText = text;

el.style.color =
color || "#00ff88";

}


/* =====================================
USER LOCATION

===================================== */

let userLat = null;
let userLng = null;


/* DAPATKAN GPS */

function getUserLocation(){

if(!navigator.geolocation){

document.getElementById(
"userInfo"
).innerHTML =
"GPS tidak didukung";

return;

}


navigator.geolocation.getCurrentPosition(

position => {


userLat =
position.coords.latitude;

userLng =
position.coords.longitude;


const accuracy =
Math.round(
position.coords.accuracy
);


/* CLEAR */

userLayer.clearLayers();


/* MARKER */

const marker =
L.marker(

[userLat,userLng],

{

icon:

L.divIcon({

className:"",

html:
'<div class="userMarker"></div>',

iconSize:[17,17],

iconAnchor:[8,8]

})

}

);


marker.bindPopup(

"<b>📍 LOKASI KAMU</b><br><br>" +

"GPS aktif<br>" +

"🎯 Akurasi ±" +

accuracy +

" meter"

);


marker.addTo(userLayer);


/* AKURASI */

L.circle(

[userLat,userLng],

{

radius:accuracy,

color:"#008cff",

weight:1,

opacity:.5,

fillOpacity:.08

}

).addTo(userLayer);


/* INFO */

document.getElementById(
"userInfo"
).innerHTML =

"🟢 GPS Aktif<br>" +

"🎯 Akurasi ±" +

accuracy +

" meter";


setStatus(
"🟢 LIVE INDONESIA",
"#00ff88"
);


},

error => {

console.log(error);

document.getElementById(
"userInfo"
).innerHTML =

"⚠️ Izinkan lokasi GPS";

},

{

enableHighAccuracy:true,

timeout:10000,

maximumAge:60000

}

);

}


/* =====================================
DISTANCE

===================================== */

function getDistance(

lat1,
lon1,
lat2,
lon2

){

const R = 6371;

const dLat =
(lat2-lat1) *
Math.PI/180;

const dLon =
(lon2-lon1) *
Math.PI/180;

const a =

Math.sin(dLat/2) *
Math.sin(dLat/2)

+

Math.cos(
lat1*Math.PI/180
)

*

Math.cos(
lat2*Math.PI/180
)

*

Math.sin(dLon/2) *
Math.sin(dLon/2);


const c =

2 *

Math.atan2(

Math.sqrt(a),

Math.sqrt(1-a)

);


return R*c;

}


/* =====================================
ARAH

===================================== */

function getDirection(

lat1,
lon1,
lat2,
lon2

){

const y =

Math.sin(
(lon2-lon1) *
Math.PI/180
)

*

Math.cos(
lat2*Math.PI/180
);


const x =

Math.cos(
lat1*Math.PI/180
)

*

Math.sin(
lat2*Math.PI/180
)

-

Math.sin(
lat1*Math.PI/180
)

*

Math.cos(
lat2*Math.PI/180
)

*

Math.cos(
(lon2-lon1) *
Math.PI/180
);


let bearing =

Math.atan2(y,x) *
180/Math.PI;


bearing =
(bearing + 360) % 360;


const dirs = [

"Utara",
"Timur Laut",
"Timur",
"Tenggara",
"Selatan",
"Barat Daya",
"Barat",
"Barat Laut"

];


return dirs[
Math.round(bearing/45)%8
];

}


/* =====================================
CEK INDONESIA

===================================== */

function isIndonesia(lat,lng){

return (

lat >=
INDONESIA_BOUNDS.minLat

&&

lat <=
INDONESIA_BOUNDS.maxLat

&&

lng >=
INDONESIA_BOUNDS.minLng

&&

lng <=
INDONESIA_BOUNDS.maxLng

);

}


/* =====================================
KNOWN EVENT

===================================== */

let knownEarthquakes =
new Set();


/* =====================================
LOAD GEMPA

===================================== */

async function loadEarthquakes(){

try{

setStatus(
"🟡 MENGAMBIL DATA...",
"#ffd000"
);


const response =
await fetch(

EARTHQUAKE_URL,

{
cache:"no-store"
}

);


if(!response.ok){

throw new Error(
"Data gagal"
);

}


const data =
await response.json();


/* FILTER INDONESIA */

const earthquakes =

data.features

.filter(eq => {

const c =
eq.geometry.coordinates;

const lng =
c[0];

const lat =
c[1];

return (

eq.properties.mag !== null

&&

isIndonesia(
lat,
lng
)

);

})

.sort(

(a,b) =>

b.properties.time -
a.properties.time

)

.slice(

0,
MAX_EARTHQUAKES

);


/* CLEAR */

earthquakeLayer.clearLayers();


const feed =
document.getElementById(
"feed"
);

feed.innerHTML = "";


let maxMag = 0;

let nearestDistance =
Infinity;


/* LOOP */

earthquakes.forEach(eq => {


const p =
eq.properties;

const c =
eq.geometry.coordinates;

const lng =
c[0];

const lat =
c[1];

const depth =
c[2];

const mag =
p.mag;


/* MAX */

if(mag > maxMag){

maxMag = mag;

}


/* DISTANCE */

let distanceText =
"GPS belum aktif";

let directionText =
"";


if(
userLat !== null &&
userLng !== null
){

const distance =
getDistance(

userLat,
userLng,

lat,
lng

);


distanceText =
Math.round(distance) +
" km";


directionText =
getDirection(

userLat,
userLng,

lat,
lng

);


if(
distance <
nearestDistance
){

nearestDistance =
distance;

}

}


/* MARKER */

const marker =
L.marker(

[lat,lng],

{

icon:

L.divIcon({

className:"",

html:
'<div class="eqMarker"></div>',

iconSize:
[12,12],

iconAnchor:
[6,6]

})

}

);


marker.bindPopup(

"<b style='color:#ff4444'>" +

"🔴 GEMPA INDONESIA" +

"</b><br><br>" +

"📍 " +

(p.place ||
"Indonesia") +

"<br>" +

"📊 Magnitudo: M " +
mag +

"<br>" +

"⬇ Kedalaman: " +
depth +
" km" +

"<br>" +

"📏 Jarak: " +
distanceText +

"<br>" +

"🧭 Arah: " +
directionText +

"<br>" +

"🕒 " +

new Date(
p.time
)

.toLocaleString(
"id-ID"
)

);


marker.addTo(
earthquakeLayer
);


/* GEMPA BARU */

if(
!knownEarthquakes.has(
eq.id
)
){

createWave(
lat,
lng,
mag
);

knownEarthquakes.add(
eq.id
);

}


/* FEED */

const item =
document.createElement(
"div"
);


item.className =
"feedItem";


item.innerHTML =

'<div class="feedMag">' +

'M ' +
mag +

'</div>' +

'<div class="feedPlace">' +

'📍 ' +

(p.place ||
"Indonesia") +

'</div>' +

'<div class="feedDistance">' +

'📏 ' +
distanceText +

(
directionText
?

' • ' +
directionText

:
''
) +

'</div>';


feed.appendChild(
item
);


});


/* STATS */

document.getElementById(
"eqCount"
).innerText =
earthquakes.length;


document.getElementById(
"maxMag"
).innerText =
maxMag ?
"M " + maxMag
:
"-";


document.getElementById(
"nearest"
).innerText =

nearestDistance !== Infinity

?

Math.round(
nearestDistance
) +
" km"

:
"-";


document.getElementById(
"update"
).innerText =

new Date()

.toLocaleTimeString(
"id-ID",
{
hour:"2-digit",
minute:"2-digit"
}
);


/* SIMPAN EVENT */

knownEarthquakes =
new Set(

earthquakes.map(
eq => eq.id
)

);


setStatus(
"🟢 LIVE INDONESIA",
"#00ff88"
);


}

catch(error){

console.error(error);

setStatus(
"🔴 DATA GAGAL",
"#ff4444"
);

}

}


/* =====================================
CANVAS WAVE

===================================== */

const canvas =
document.getElementById(
"waveCanvas"
);

const ctx =
canvas.getContext(
"2d"
);

let waves = [];


/* RESIZE */

function resizeCanvas(){

const rect =
canvas.getBoundingClientRect();

const ratio =
Math.min(
devicePixelRatio,
2
);

canvas.width =
rect.width *
ratio;

canvas.height =
rect.height *
ratio;

ctx.setTransform(
ratio,
0,
0,
ratio,
0,
0
);

}

resizeCanvas();

window.addEventListener(
"resize",
resizeCanvas
);


/* CREATE */

function createWave(
lat,
lng,
mag
){

waves.push({

lat:lat,

lng:lng,

radius:8,

alpha:1,

maxRadius:

Math.min(
220,
70 + mag * 30
)

});

}


/* ANIMATION */

let lastFrame = 0;

function animateWaves(time){

if(
time - lastFrame < 33
){

requestAnimationFrame(
animateWaves
);

return;

}

lastFrame = time;


const rect =
canvas.getBoundingClientRect();


ctx.clearRect(

0,
0,

rect.width,
rect.height

);


waves.forEach(wave => {


const point =
map.latLngToContainerPoint(

[wave.lat,wave.lng]

);


ctx.beginPath();

ctx.arc(

point.x,
point.y,

wave.radius,

0,
Math.PI * 2

);


ctx.strokeStyle =

"rgba(255,30,30," +

wave.alpha +

")";


ctx.lineWidth = 2;

ctx.stroke();


wave.radius += 2.5;

wave.alpha -= 0.02;


});


waves =
waves.filter(

wave =>

wave.alpha > 0

&&

wave.radius <
wave.maxRadius

);


requestAnimationFrame(
animateWaves
);

}


requestAnimationFrame(
animateWaves
);


/* =====================================
START

===================================== */

getUserLocation();

loadEarthquakes();


setInterval(

loadEarthquakes,

REFRESH_TIME

);

</script>

</body>
</html>
